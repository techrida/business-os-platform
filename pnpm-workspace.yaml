# pnpm 11 settings live here (not in .npmrc or package.json). Key names checked against
# https://pnpm.io/11.x/settings (build.allowBuilds, dependency-resolution.minimumReleaseAge).
packages:
  - apps/*
  - packages/*
  - tools/*

# Supply chain: refuse versions published less than one day ago, for direct and transitive
# dependencies. Explicitly setting it also turns on minimumReleaseAgeStrict.
minimumReleaseAge: 1440

# Install scripts are blocked unless allowed here. true = may run its install script,
# false = reviewed and denied. The denied entries are optional native add-ons with a pure-JS
# fallback (msgpackr-extract via bullmq, ssh2 and cpu-features via testcontainers).
allowBuilds:
  '@swc/core': true
  esbuild: true
  msgpackr-extract: false
  ssh2: false
  cpu-features: false

# The first install was not run when this file was written, so the full dependency graph was
# not scanned for other install scripts. With false, an unlisted script is skipped and
# reported as a warning instead of failing the install. After the first clean install, run
# `pnpm approve-builds` to review anything it lists, then remove this line (default is true).
strictDepBuilds: false

# pdfjs-dist lists the native `canvas` add-on as optional; the viewer renders in the browser and the
# server never rasterises, so it is not installed.
ignoredOptionalDependencies:
  - canvas
  - '@napi-rs/canvas'

# Security overrides (Dependabot alerts 1-3). Each selector names the one package that pins the
# vulnerable range; drop an entry once that package ships a fixed range itself.
overrides:
  # glob < 14.0.2 (alert 2). archiver-utils (via testcontainers > archiver) pins glob ^10 and only calls glob.sync.
  'archiver-utils>glob': ^14.0.2
  # minimatch < 11.0.1 (alert 3). @swc/cli pins ^9 and only calls the named minimatch() export.
  '@swc/cli>minimatch': ^11.0.1
  # esbuild < 0.25.0 (alert 1). @esbuild-kit/core-utils (via drizzle-kit) pins ~0.18.20; drizzle-kit itself already uses 0.25.x.
  '@esbuild-kit/core-utils>esbuild': ^0.25.4

# One place for every external version. Workspace package.json files use "catalog:".
