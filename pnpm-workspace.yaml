  '@nestjs/core': ^12.5.1
  '@nestjs/platform-express': ^12.5.1
  '@nestjs/testing': ^12.5.1
  '@nestjs/terminus': ^12.2.0
  '@nestjs/bullmq': ^12.0.2
  '@nestjs/cli': ^12.0.15
  '@swc/core': ^1.16.22
  '@swc/cli': ^0.8.2
  chokidar: ^6.0.0
  unplugin-swc: ^2.0.0
  '@types/express': ^5.0.6
  reflect-metadata: ^0.2.2
  rxjs: ^7.8.2
  nestjs-pino: ^5.3.2
  pino: ^10.4.0
  pino-http: ^11.0.0
  prom-client: ^15.1.3
  jose: ^6.2.18
  bullmq: ^5.81.5
  ioredis: ^6.1.0
  ioredis-mock: ^8.13.0
  server-only: ^0.0.1

  # Data
  drizzle-orm: ^0.45.4
  drizzle-kit: ^0.31.11
  pg: ^8.23.1
  '@types/pg': ^8.23.1

  # P1 platform kernel (checked on the npm registry 2026-11-08, see the P1 plan §2)
  decimal.js: ^10.6.0
  file-type: ^22.3.0
