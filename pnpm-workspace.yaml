  eslint-config-next: ^16.4.6
  globals: ^17.14.0
  prettier: ^3.10.1
  tsx: ^4.23.15
  fast-check: ^4.10.3
  '@playwright/test': ^1.65.1
  supertest: ^7.3.2
  '@types/supertest': ^7.2.1
  testcontainers: ^12.2.2
  '@testcontainers/postgresql': ^12.2.2

  # API and worker
