<style>
/* One infinite board. Elements are glass cards with a kind sticker on the corner, sections are quiet frames,
   the controls are thin floating glass. Read-only: nothing here edits the model. */
:root {
  --bg: #f5f3ef; --fg: #19191b; --muted: #6b6a6f; --faint: #9d9ca2; --line: #e3e0da;
  --accent: #3657f0; --accent-soft: #3657f01f; --on-accent: #ffffff; --die: #ffffff;
  --warn: #f59f00; --on-warn: #2a1c00; --bad: #d6336c; --on-bad: #ffffff;
  --dot: rgba(25, 25, 27, .13);
  --frame: rgba(255, 255, 255, .42); --frame-line: rgba(25, 25, 27, .07);
  --edge: #a9a399; --edge-hl: #3a3a40;
  --glass: linear-gradient(180deg, rgba(255, 255, 255, .9), rgba(255, 255, 255, .7));
  --glass-rim: linear-gradient(140deg, #fff 0%, rgba(255, 255, 255, .4) 28%, rgba(255, 255, 255, 0) 55%, rgba(255, 255, 255, .6) 100%);
  --glass-edge: inset 0 1px 0 rgba(255, 255, 255, .95), inset 0 -10px 18px -14px rgba(120, 100, 80, .2), 0 0 0 .5px rgba(25, 25, 27, .09), 0 1px 2px rgba(40, 30, 20, .06), 0 12px 32px -14px rgba(40, 30, 20, .28);
  --glass-float: linear-gradient(180deg, rgba(255, 255, 255, .62), rgba(255, 255, 255, .4));
  --glass-float-rim: linear-gradient(140deg, #fff 0%, rgba(255, 255, 255, .55) 24%, rgba(255, 255, 255, .08) 52%, rgba(255, 255, 255, .7) 100%);
  --glass-float-edge: inset 0 1px 0 rgba(255, 255, 255, .95), inset 0 0 0 .5px rgba(255, 255, 255, .45), 0 0 0 .5px rgba(25, 25, 27, .08), 0 1px 2px rgba(40, 30, 20, .06), 0 14px 34px -14px rgba(40, 30, 20, .32);
  --glass-float-blur: blur(14px) saturate(2) brightness(1.04);
  --field: rgba(255, 255, 255, .7);
  --sticker-lift: 0 6px 12px -5px rgba(60, 40, 20, .45);
  --paper: #efebe4; --ink-face: #1d1d22; --ink-text: #ffffff; --cut: rgba(25, 25, 27, .13);
  --button-lift: 0 1px 1px rgba(60, 40, 20, .16), 0 6px 12px -5px rgba(60, 40, 20, .5);
  --button-lift-up: 0 1px 1px rgba(60, 40, 20, .12), 0 10px 18px -7px rgba(60, 40, 20, .5);
  --hatch: rgba(90, 90, 100, .13);
  --font: "Bricolage Grotesque", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --spring: cubic-bezier(.3, 1.5, .5, 1);
  --cw: 212px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111113; --fg: #ececee; --muted: #9b9aa2; --faint: #6c6b73; --line: #2b2b30;
    --accent: #7d95ff; --accent-soft: #7d95ff2a; --on-accent: #101018; --dot: rgba(255, 255, 255, .09);
    --warn: #ffc23d; --on-warn: #2a1c00; --bad: #ff6b9a; --on-bad: #2a0614;
    --frame: rgba(255, 255, 255, .025); --frame-line: rgba(255, 255, 255, .07);
    --edge: #5a5a64; --edge-hl: #d8d8de;
    --glass: linear-gradient(180deg, rgba(48, 48, 56, .92), rgba(32, 32, 38, .86));
    --glass-rim: linear-gradient(140deg, rgba(255, 255, 255, .3) 0%, rgba(255, 255, 255, .07) 32%, rgba(255, 255, 255, 0) 58%, rgba(255, 255, 255, .14) 100%);
    --glass-edge: inset 0 1px 0 rgba(255, 255, 255, .1), inset 0 -10px 18px -14px rgba(0, 0, 0, .5), 0 0 0 .5px rgba(255, 255, 255, .06), 0 12px 32px -14px rgba(0, 0, 0, .75);
    --glass-float: linear-gradient(180deg, rgba(58, 58, 68, .62), rgba(28, 28, 34, .5));
    --glass-float-rim: linear-gradient(140deg, rgba(255, 255, 255, .45) 0%, rgba(255, 255, 255, .12) 28%, rgba(255, 255, 255, 0) 55%, rgba(255, 255, 255, .22) 100%);
    --glass-float-edge: inset 0 1px 0 rgba(255, 255, 255, .16), inset 0 0 0 .5px rgba(255, 255, 255, .08), 0 14px 34px -14px rgba(0, 0, 0, .8);
    --glass-float-blur: blur(14px) saturate(1.9) brightness(.92);
    --field: rgba(255, 255, 255, .06);
    --sticker-lift: 0 6px 12px -5px rgba(0, 0, 0, .7);
    --paper: #4a4a53; --ink-face: #f2f2f4; --ink-text: #18181b; --cut: rgba(0, 0, 0, .5);
    --button-lift: 0 4px 9px -4px rgba(0, 0, 0, .8); --button-lift-up: 0 9px 16px -7px rgba(0, 0, 0, .85);
    --hatch: rgba(255, 255, 255, .08);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111113; --fg: #ececee; --muted: #9b9aa2; --faint: #6c6b73; --line: #2b2b30;
  --accent: #7d95ff; --accent-soft: #7d95ff2a; --on-accent: #101018; --dot: rgba(255, 255, 255, .09);
  --warn: #ffc23d; --on-warn: #2a1c00; --bad: #ff6b9a; --on-bad: #2a0614;
  --frame: rgba(255, 255, 255, .025); --frame-line: rgba(255, 255, 255, .07);
  --edge: #5a5a64; --edge-hl: #d8d8de;
  --glass: linear-gradient(180deg, rgba(48, 48, 56, .92), rgba(32, 32, 38, .86));
  --glass-rim: linear-gradient(140deg, rgba(255, 255, 255, .3) 0%, rgba(255, 255, 255, .07) 32%, rgba(255, 255, 255, 0) 58%, rgba(255, 255, 255, .14) 100%);
  --glass-edge: inset 0 1px 0 rgba(255, 255, 255, .1), inset 0 -10px 18px -14px rgba(0, 0, 0, .5), 0 0 0 .5px rgba(255, 255, 255, .06), 0 12px 32px -14px rgba(0, 0, 0, .75);
  --glass-float: linear-gradient(180deg, rgba(58, 58, 68, .62), rgba(28, 28, 34, .5));
  --glass-float-rim: linear-gradient(140deg, rgba(255, 255, 255, .45) 0%, rgba(255, 255, 255, .12) 28%, rgba(255, 255, 255, 0) 55%, rgba(255, 255, 255, .22) 100%);
  --glass-float-edge: inset 0 1px 0 rgba(255, 255, 255, .16), inset 0 0 0 .5px rgba(255, 255, 255, .08), 0 14px 34px -14px rgba(0, 0, 0, .8);
  --glass-float-blur: blur(14px) saturate(1.9) brightness(.92);
  --field: rgba(255, 255, 255, .06);
  --sticker-lift: 0 6px 12px -5px rgba(0, 0, 0, .7);
  --paper: #4a4a53; --ink-face: #f2f2f4; --ink-text: #18181b; --cut: rgba(0, 0, 0, .5);
  --button-lift: 0 4px 9px -4px rgba(0, 0, 0, .8); --button-lift-up: 0 9px 16px -7px rgba(0, 0, 0, .85);
  --hatch: rgba(255, 255, 255, .08);
  color-scheme: dark;
}

html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 400 14px/1.4 var(--font); overflow: hidden; -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
[hidden] { display: none !important; }
::selection { background: var(--accent-soft); }

/* The board */
#vp { position: fixed; inset: 0; overflow: hidden; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none;
  background-image: radial-gradient(circle, var(--dot) 1.1px, transparent 1.5px); }
#vp.panning { cursor: grabbing; }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
#frames, #labels, #nodes { position: absolute; left: 0; top: 0; }
#edges { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
#edges, #labels { transition: opacity .2s ease; }
#edges.wait, #labels.wait { opacity: 0; transition: none; }

/* Sections: a quiet frame with a header row. It stays out of pointer events so the board can be panned across it. */
.frame { position: absolute; border-radius: 28px; background: var(--frame); box-shadow: inset 0 0 0 1px var(--frame-line); pointer-events: none; transition: opacity .2s ease; }
.fh { position: absolute; left: 0; top: 0; right: 0; height: 44px; display: flex; align-items: center; padding: 0 10px 0 14px; box-sizing: border-box; pointer-events: none; }
.fh-in { display: flex; align-items: center; gap: 9px; white-space: nowrap; max-width: 100%; min-width: 0; }
.fh .stk { position: relative; left: auto; top: auto; width: 26px; height: 26px; flex: none; }
.fh .stk svg { width: 15px; height: 15px; }
.fh-name { pointer-events: auto; border: 0; background: none; padding: 2px 4px; margin: -2px -4px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 15px; letter-spacing: -.01em;
  max-width: 340px; overflow: hidden; text-overflow: ellipsis; min-width: 0; text-align: left; }
.fh-name:hover { background: var(--field); }
.fh-tech { font-size: 12px; color: var(--muted); max-width: 260px; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.fh .chips { position: static; pointer-events: none; }
.fh .tg { pointer-events: auto; margin-left: 4px; flex: none; }
.frame.st-retired .fh-name { text-decoration: line-through; text-decoration-thickness: 1.5px; }
.frame.st-new { box-shadow: inset 0 0 0 1.5px var(--accent), 0 0 0 5px var(--accent-soft); }
.frame.k-external { box-shadow: inset 0 0 0 1.5px var(--edge); background-image: none; }
.frame.k-external::after { content: ""; position: absolute; inset: 0; border-radius: inherit; border: 1.5px dashed var(--muted); pointer-events: none; }
.frame.k-later { background: repeating-linear-gradient(135deg, var(--hatch) 0 6px, transparent 6px 12px); }
.frame.proposed { outline: 1.5px dashed var(--accent); outline-offset: 3px; }
.frame.sel { box-shadow: inset 0 0 0 1.5px var(--fg), 0 0 0 5px var(--accent-soft); }
.frame.retired { opacity: .55; }
.frame.faint { opacity: .38; }
.frame.dim { opacity: .3; }

/* Cards */
.node { position: absolute; width: var(--cw); min-height: 70px; box-sizing: border-box; padding: 13px 14px 13px 15px; border-radius: 18px;
  background: var(--glass); box-shadow: var(--glass-edge); transition: opacity .2s ease, box-shadow .2s ease; }
.node::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; background: var(--glass-rim); pointer-events: none;
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); }
.cv { display: contents; }
.hit { position: absolute; inset: 0; z-index: 1; border: 0; padding: 0; margin: 0; background: none; border-radius: inherit; cursor: pointer; }
.hit:focus-visible, .fh-name:focus-visible, .link:focus-visible, .elabel:focus-visible, .btn:focus-visible, .pbtn:focus-visible, .opt:focus-visible, #q:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
.node .who { display: block; padding-left: 21px; font-size: 11.5px; font-weight: 600; letter-spacing: .03em; color: var(--muted); margin-bottom: 5px; }
.node .ttl { display: block; font-size: 14.5px; font-weight: 500; line-height: 1.28; letter-spacing: -.005em; overflow-wrap: anywhere; }
.node .tech { display: block; margin-top: 3px; font-size: 12px; line-height: 1.3; color: var(--muted); overflow-wrap: anywhere; }
.node .tgrow { margin-top: 10px; display: flex; }
.node .tgrow .tg { position: relative; z-index: 2; }
.node.sel { box-shadow: var(--glass-edge), 0 0 0 2px var(--bg), 0 0 0 4px var(--fg); }
.node.st-new { box-shadow: var(--glass-edge), 0 0 0 2px var(--accent), 0 0 0 7px var(--accent-soft); }
.node.sel.st-new { box-shadow: var(--glass-edge), 0 0 0 2px var(--bg), 0 0 0 4px var(--fg); }
.node.now { box-shadow: var(--glass-edge), 0 0 0 2px var(--accent), 0 0 0 12px var(--accent-soft); }
.node.pulse, .frame.pulse { animation: pulse .9s ease-out 2; }
@keyframes pulse { 0% { box-shadow: var(--glass-edge), 0 0 0 2px var(--accent), 0 0 0 4px var(--accent-soft); } 60% { box-shadow: var(--glass-edge), 0 0 0 2px var(--accent), 0 0 0 16px transparent; } 100% { box-shadow: var(--glass-edge), 0 0 0 2px var(--accent), 0 0 0 4px transparent; } }
.node.retired .ttl, .node.retired .tech { text-decoration: line-through; text-decoration-thickness: 1.5px; }
.node.retired { opacity: .55; }
.node.faint { opacity: .38; }
.node.dim { opacity: .26; }
.node.proposed { outline: 1.5px dashed var(--accent); outline-offset: 3px; }
.node.k-external::after { content: ""; position: absolute; inset: 0; border-radius: inherit; border: 1.5px dashed var(--muted); pointer-events: none; }
.node.k-later { background: repeating-linear-gradient(135deg, var(--hatch) 0 6px, transparent 6px 12px), var(--glass); }
.node.k-later .ttl { color: var(--muted); }

/* Kind sticker, stuck half on the corner. */
.stk { position: absolute; left: -9px; top: -11px; width: 30px; height: 30px; border-radius: 50%; background: var(--c); display: grid; place-items: center;
  box-shadow: 0 0 0 3px var(--die), var(--sticker-lift); rotate: -6deg; overflow: hidden; transition: rotate .3s var(--spring), translate .3s var(--spring); }
.stk::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(135deg, transparent 32%, rgba(255, 255, 255, .28) 32% 50%, transparent 50%); }
.stk svg { width: 18px; height: 18px; fill: #fff; position: relative; }
@media (hover: hover) { .node:hover .stk { translate: 0 -2px; rotate: -10deg; } }

/* Chips: status and proposed. Colour is never the only signal, each carries its word. */
.chips { position: absolute; right: -8px; top: -10px; display: flex; gap: 4px; z-index: 2; pointer-events: none; }
.chip { display: inline-flex; align-items: center; height: 19px; padding: 0 8px; border-radius: 99px; font-size: 10.5px; font-weight: 700; letter-spacing: .03em; white-space: nowrap;
  box-shadow: 0 0 0 2px var(--die), 0 3px 6px -3px rgba(60, 40, 20, .5); background: var(--paper); color: var(--fg); }
.chip.new { background: var(--accent); color: var(--on-accent); }
.chip.changed { background: var(--warn); color: var(--on-warn); }
.chip.retired { background: var(--bad); color: var(--on-bad); }
.chip.proposed { background: var(--bg); color: var(--muted); box-shadow: 0 0 0 1.5px var(--muted); }
.chip.inner { background: var(--paper); color: var(--fg); }
.chip.same { background: var(--paper); color: var(--muted); }

/* Links */
.eg { color: var(--edge); transition: opacity .2s ease; }
.eg .e { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.eg .ah { fill: currentColor; }
.eg .ehit { fill: none; stroke: transparent; stroke-width: 16; pointer-events: stroke; cursor: pointer; }
.eg.ret .e { stroke-dasharray: 6 6; }
.eg.ret { opacity: .55; }
.eg.hl { color: var(--edge-hl); }
.eg.on { color: var(--accent); }
.eg.on .e { stroke-width: 2.6; }
.eg.sel { color: var(--accent); }
.eg.faint { opacity: .3; }
.eg.dim { opacity: .18; }
.elabel { position: absolute; translate: -50% -50%; padding: 3px 9px; border: 0; border-radius: 99px; background: var(--bg); box-shadow: 0 0 0 1px var(--line);
  font-size: 11.5px; font-weight: 600; color: var(--muted); white-space: nowrap; cursor: pointer; transition: opacity .2s ease, color .2s ease; }
.elabel:hover, .elabel.sel { color: var(--fg); box-shadow: 0 0 0 1.5px var(--accent); }
.elabel.ret { text-decoration: line-through; opacity: .6; }
.elabel.faint { opacity: .3; }
.elabel.dim { opacity: .18; }
#vp.playing .ehit { pointer-events: none; }
#tmpl { fill: none; stroke: var(--accent); stroke-width: 2; stroke-dasharray: 5 6; }
#token circle { fill: var(--accent); stroke: #fff; stroke-width: 3.5; }

/* Buttons are stickers (one recipe). */
.btn { --die-w: 3px; position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 34px; padding: 0 16px;
  border: 0; border-radius: 99px; background: var(--paper); color: var(--fg); font: 600 13px/1 var(--font); white-space: nowrap; cursor: pointer;
  box-shadow: 0 0 0 var(--die-w) var(--die), 0 0 0 calc(var(--die-w) + .5px) var(--cut), var(--button-lift);
  transition: translate .3s var(--spring), rotate .3s var(--spring), scale .12s ease, box-shadow .2s ease, background .2s ease; }
.btn.sm { --die-w: 2.5px; min-height: 28px; padding: 0 12px; font-size: 12px; }
.btn.icon { width: 34px; padding: 0; }
.btn.icon.sm { width: 28px; }
.btn svg { width: 16px; height: 16px; flex: none; transition: rotate .3s var(--spring); }
.btn.sm svg { width: 14px; height: 14px; }
.btn[aria-pressed="true"]:not(.accent), .btn[aria-selected="true"], .btn.primary { background: var(--ink-face); color: var(--ink-text); }
.btn.accent[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
@media (hover: hover) {
  .btn:hover:not(:disabled) { translate: 0 -1.5px; rotate: -1deg; box-shadow: 0 0 0 var(--die-w) var(--die), 0 0 0 calc(var(--die-w) + .5px) var(--cut), var(--button-lift-up); }
  .btn.icon:hover:not(:disabled) { rotate: 0deg; }
}
.btn:active:not(:disabled) { translate: 0; rotate: 0deg; scale: .95; }
.btn:disabled { cursor: default; opacity: .45; box-shadow: 0 0 0 var(--die-w) var(--die), 0 0 0 calc(var(--die-w) + .5px) var(--cut); }
.btn.tg { min-height: 26px; --die-w: 2px; }
.btn.tg.icon { width: 26px; }

/* Floating controls: thin glass. */
.bar { position: relative; border-radius: 22px; background: var(--glass-float); -webkit-backdrop-filter: var(--glass-float-blur); backdrop-filter: var(--glass-float-blur);
  box-shadow: var(--glass-float-edge); }
.bar::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; background: var(--glass-float-rim); pointer-events: none;
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); }

#top { position: fixed; z-index: 5; top: calc(14px + env(safe-area-inset-top, 0px)); left: calc(14px + env(safe-area-inset-left, 0px)); right: calc(14px + env(safe-area-inset-right, 0px));
  display: flex; flex-wrap: wrap; align-items: flex-start; gap: 10px 12px; pointer-events: none; }
#top > * { pointer-events: auto; }
#head { padding: 10px 18px 10px 16px; max-width: min(460px, 100%); box-sizing: border-box; min-width: 0; }
#head h1 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: -.01em; line-height: 1.15; text-wrap: balance; overflow-wrap: anywhere; }
#head p { margin: 2px 0 0; font-size: 12.5px; color: var(--muted); line-height: 1.35; overflow-wrap: anywhere; }
#tools { flex: 1 1 520px; display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 10px 14px; padding: 10px 12px; box-sizing: border-box; max-width: 100%; }
.grp { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.grp .lab { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-right: 2px; }
.srch { position: relative; }
#q { width: 168px; box-sizing: border-box; height: 30px; border: 0; border-radius: 99px; padding: 0 12px; background: var(--field); box-shadow: 0 0 0 .5px var(--line); font-size: 12.5px; }
#q::placeholder { color: var(--muted); }
#q:focus { outline: none; box-shadow: 0 0 0 1.5px var(--accent); }
#q:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; box-shadow: none; }
.pop { position: absolute; top: calc(100% + 14px); right: 0; z-index: 7; box-sizing: border-box; padding: 8px; border-radius: 20px; background: var(--glass);
  -webkit-backdrop-filter: blur(20px) saturate(1.7); backdrop-filter: blur(20px) saturate(1.7); box-shadow: var(--glass-edge); }
#qres { list-style: none; margin: 0; width: 300px; max-width: calc(100vw - 28px); max-height: 320px; overflow: auto; }
.opt { display: flex; flex-direction: column; gap: 1px; width: 100%; box-sizing: border-box; padding: 7px 10px; border: 0; border-radius: 12px; background: none; text-align: left; cursor: pointer; }
.opt .n { font-size: 13px; font-weight: 600; overflow-wrap: anywhere; }
.opt .m { font-size: 11.5px; color: var(--muted); overflow-wrap: anywhere; }
.opt:hover, .opt[aria-selected="true"] { background: var(--field); box-shadow: 0 0 0 1.5px var(--accent); }
.qnone { padding: 10px; font-size: 12.5px; color: var(--muted); }
#key { width: 292px; max-width: calc(100vw - 28px); padding: 14px; right: 0; }
#key h3 { margin: 0 0 8px 4px; font-size: 11.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
#key h3:not(:first-child) { margin-top: 14px; }
.krow { display: flex; align-items: center; gap: 10px; padding: 4px; font-size: 13px; }
.krow .stk { position: relative; left: auto; top: auto; width: 22px; height: 22px; flex: none; }
.krow .stk svg { width: 13px; height: 13px; }
.krow .t { display: block; font-weight: 600; }
.krow .d { display: block; font-size: 11.5px; color: var(--muted); line-height: 1.3; }
.krow .chip { box-shadow: 0 0 0 2px var(--die); flex: none; min-width: 62px; justify-content: center; }
.kline { display: block; width: 28px; height: 0; border-top: 2px solid var(--edge); flex: none; }

<script>
(function () {
"use strict";

/* ===== MODEL LOGIC (pure, no DOM). SCHEMA.md phase and collapse rules live here. ===== */
function createLogic(M) {
  const phases = M.phases || [];
  const pidx = Object.create(null);
  phases.forEach((p, i) => { pidx[p.id] = i; });
  const els = new Map();
  (M.elements || []).forEach((e) => els.set(e.id, e));
  const kidsAll = new Map();
  els.forEach((e) => {
    if (e.parent && els.has(e.parent)) {
      if (!kidsAll.has(e.parent)) kidsAll.set(e.parent, []);
      kidsAll.get(e.parent).push(e);
    }
  });
  const idx = (v, d) => (v != null && v in pidx ? pidx[v] : d);
  // exists: since <= i and (no until, or i < until)
  const alive = (o, i) => idx(o.since, 0) <= i && !(o.until != null && o.until in pidx && i >= pidx[o.until]);
  // the phase an item is retired in: drawn faded and struck through in this phase only
  const retiredNow = (o, i) => o.until != null && idx(o.until, -1) === i && idx(o.since, 0) <= i;
  const present = (o, i) => alive(o, i) || retiredNow(o, i);
  function status(o, i) {
    const P = phases[i].id;
    if (retiredNow(o, i)) return "retired";
    if (o.since === P) return "new";
    if (o.changes && o.changes[P]) return "changed";
    return "same";
  }
  const memo = [];
  // shown: present at phase i and every ancestor is shown too
  function shown(id, i) {
    const m = memo[i] || (memo[i] = new Map());
    if (m.has(id)) return m.get(id);
    m.set(id, false);
    const o = els.get(id);
    let r = !!o && present(o, i);
    if (r && o.parent) r = els.has(o.parent) && shown(o.parent, i);
    m.set(id, r);
    return r;
  }
  const shownKids = (id, i) => (kidsAll.get(id) || []).filter((k) => shown(k.id, i));
  function shownDesc(id, i) {
    const out = [], st = shownKids(id, i);
    while (st.length) { const k = st.shift(); out.push(k); st.push(...shownKids(k.id, i)); }
    return out;
  }
  const isSection = (id, i) => shownKids(id, i).length > 0;
  // visible: shown and every ancestor expanded
  function visible(id, i, exp) {
    if (!shown(id, i)) return false;
    for (let p = els.get(id).parent; p; p = els.get(p).parent) if (!exp.has(p)) return false;
    return true;
  }
  // lift: nearest visible ancestor-or-self (null when the element is not shown at all)
  function lift(id, i, exp) {
    if (!shown(id, i)) return null;
    for (let c = id; c; c = els.get(c).parent) if (visible(c, i, exp)) return c;
    return null;
  }
  function ancestors(id) {
    const out = [];
    for (let p = els.has(id) ? els.get(id).parent : null; p && els.has(p) && out.length < 50; p = els.get(p).parent) out.push(p);
    return out;
  }
  const relPresent = (r, i) => present(r, i) && shown(r.src, i) && shown(r.dst, i);
  const relsAt = (i) => (M.relations || []).filter((r) => relPresent(r, i));
  // lifted + dropped (same box) + merged arrows
  function lifted(i, exp) {
    const P = phases[i].id, groups = new Map(), out = [];
    for (const r of M.relations || []) {
      if (!relPresent(r, i)) continue;
      const a = lift(r.src, i, exp), b = lift(r.dst, i, exp);
      if (!a || !b || a === b) continue;
      const k = a + "\u0001" + b;
      let g = groups.get(k);
      if (!g) { g = { id: "e:" + a + ">" + b, src: a, dst: b, rels: [] }; groups.set(k, g); out.push(g); }
      g.rels.push(r);
    }
    for (const g of out) {
      const one = g.rels.length === 1;
      g.label = one ? (g.rels[0].label || "1 link") : g.rels.length + " links";
      g.tech = one ? (g.rels[0].tech || "") : "";
      g.retired = g.rels.every((r) => retiredNow(r, i));
      g.isNew = g.rels.some((r) => r.since === P);
    }
    return out;
  }
  const flowsAt = (i) => (M.flows || []).filter((f) => idx(f.since, 0) <= i);
  // usable steps: both ends shown at this phase (not lifted yet)
  const flowSteps = (f, i) => (f.steps || []).filter((s) => shown(s.src, i) && shown(s.dst, i));
  const depthOf = (id) => ancestors(id).length;
  function presetSet(name) {
    const s = new Set();
    els.forEach((o, id) => {
      if (!kidsAll.has(id)) return;
      const d = depthOf(id);
      if (name === "everything" || (name === "containers" && d <= 0) || (name === "components" && d <= 1)) s.add(id);
    });
    return s;
  }
  function defaultExpanded() {
    const s = new Set();
    // Start at the Containers level (top-level sections open) so the first view is readable.
    // A section can opt in with collapsed: false, or stay shut with collapsed: true.
    els.forEach((o, id) => { if (kidsAll.has(id) && o.collapsed !== true && (depthOf(id) <= 0 || o.collapsed === false)) s.add(id); });
    return s;
  }
  const sectionIds = () => [...kidsAll.keys()];
  return { phases, pidx, els, kidsAll, idx, status, shown, shownKids, shownDesc, isSection, visible, lift, ancestors, relsAt, lifted, flowsAt, flowSteps, presetSet, defaultExpanded, sectionIds, retiredNow };
}
/* ===== END MODEL LOGIC ===== */

const KEY = "bos-map-v1";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

function fatal(title, lines) {
  const f = $("#fatal");
  f.innerHTML = `<h2>${esc(title)}</h2>` + lines.map((l) => `<p>${esc(l)}</p>`).join("");
  f.hidden = false;
}

/* ---------- Loading: ELK, then the model (fixture on request or when model.js is missing) ---------- */
function loadScript(src) {
  return new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = src; s.onload = () => res(); s.onerror = () => rej(new Error("Could not load " + src));
    document.head.appendChild(s);
  });
}
async function boot() {
  if (typeof ELK === "undefined") {
    fatal("The layout engine did not load", ["This map needs elkjs from cdn.jsdelivr.net. Check the connection, then reload the page."]);
    return;
  }
  const wantFixture = /[?&]fixture(=|&|$)/.test(location.search);
  let fixture = wantFixture;
  try {
    if (!wantFixture && window.BOS_MODEL) { /* inlined by build.mjs */ }
    else if (!wantFixture) {
      try { await loadScript("model.js"); }
      catch (e) { console.warn("model.js not found next to map.html, using model.fixture.js instead."); fixture = true; }
    }
    if (fixture || !window.BOS_MODEL) { fixture = true; await loadScript("model.fixture.js"); }
  } catch (e) {
    fatal("The map data did not load", ["Expected model.js (or model.fixture.js with ?fixture) in the same folder as map.html.", String(e && e.message || e)]);
    return;
  }
  const M = window.BOS_MODEL;
  if (!M || !Array.isArray(M.phases) || !M.phases.length || !Array.isArray(M.elements)) {
    fatal("The map data is not valid", ["window.BOS_MODEL needs at least one phase and an elements array. See SCHEMA.md."]);
    return;
  }
  try { await (document.fonts && document.fonts.ready); } catch (e) {}
  main(M, fixture);
}

function main(M, usedFixture) {
const LG = createLogic(M);

/* ---------- Kinds, statuses, icons ---------- */
const KINDS = {
  person:    { label: "Person",    color: "#0a7cff", desc: "A human who uses the system", glyph: '<circle cx="12" cy="8.3" r="3.7"/><path d="M4.8 19.6c.9-3.8 3.7-5.9 7.2-5.9s6.3 2.1 7.2 5.9z"/>' },
  system:    { label: "System",    color: "#7048e8", desc: "A software system as a whole", glyph: '<path d="M12 2.8 20.2 7v10L12 21.2 3.8 17V7z"/><path d="M3.8 7 12 11.2 20.2 7M12 11.2v10" fill="none" style="stroke:var(--c)" stroke-width="1.7" stroke-linejoin="round"/>' },
  container: { label: "Container", color: "#0f9d9a", desc: "An app or service we deploy", glyph: '<rect x="3.5" y="5" width="17" height="14" rx="2.6"/><path d="M3.5 9.6h17" fill="none" style="stroke:var(--c)" stroke-width="1.7"/>' },
  component: { label: "Component", color: "#2fb36b", desc: "A part inside a container", glyph: '<rect x="4" y="4" width="7" height="7" rx="1.7"/><rect x="13" y="4" width="7" height="7" rx="1.7"/><rect x="4" y="13" width="7" height="7" rx="1.7"/><rect x="13" y="13" width="7" height="7" rx="1.7" opacity=".55"/>' },

function near(p, b) {

async function computeLayout() {
  const i = state.phase, exp = state.expanded;
  const ids = [...LG.els.keys()].filter((id) => LG.visible(id, i, exp));
  const vis = new Set(ids), kidsOf = new Map();

  const frames = new Set(ids.filter((id) => isFrameId(id, vis, kidsOf)));
  const edges = LG.lifted(i, exp);
  if (!ids.length) return { ids, frames, boxes: new Map(), edges: [], w: 0, h: 0, byPair: new Map() };

  let res;

  catch (e) {
    console.warn("[map] ELK failed with edge labels, retrying without them.", e);

  }
  const rd = readElk(res, edges);
  const boxes = new Map();
  for (const id of ids) {
    const b = rd.boxes.get(id);
    if (!b) throw new Error("ELK returned no box for " + id);
    boxes.set(id, { x: Math.round(b.x * 100) / 100, y: Math.round(b.y * 100) / 100, w: b.w, h: b.h, frame: frames.has(id) });

/* ---------- Clicks (native, so buttons and keyboard work) ---------- */
vp.addEventListener("click", (e) => {

  const t = e.target;

/* ---------- Selection, expand/collapse, reveal ---------- */
function selBox() {

}

/* ---------- Focus, dim, highlight ---------- */
let play = null;

    const b = selBox();
    if (b) {
      bright = new Set([b]); edgeHl = new Set();

}

    const e = L && L.edges.find((x) => x.id === state.sel.id);
    if (!e) { sheet.hidden = true; state.sel = null; return; }
    h += `<div class="sh-head"><span class="sh-kind">${e.rels.length > 1 ? e.rels.length + " links merged" : "Link"}${e.retired ? " · retired" : ""}</span><button class="btn icon sm" id="shClose" type="button" aria-label="Close details">${ICON.close}</button></div>`;
    h += `<div><h2>${esc(LG.els.get(e.src).name)} → ${esc(LG.els.get(e.dst).name)}</h2></div>`;
    h += `<ul class="sh-list">${e.rels.map((r) => `<li class="rel"><span class="lb">${esc(LG.els.get(r.src).name)} →</span> ${goBtn(r.dst)}<br><span>${esc(r.label || "link")}${LG.retiredNow(r, i) ? " (retired)" : ""}</span>${r.tech ? `<span class="tc">${esc(r.tech)}</span>` : ""}<br><span class="lb">from</span> ${goBtn(r.src)}</li>`).join("")}</ul>`;
  }
  const fid = sheet.contains(document.activeElement) ? document.activeElement.id : "";
  sheet.innerHTML = h; sheet.hidden = false; positionChrome();
  if (fid) { const n = document.getElementById(fid); if (n) n.focus({ preventScroll: true }); }
  $("#shClose").onclick = deselect;
  sheet.querySelectorAll("[data-go]").forEach((b) => { b.onclick = () => reveal(b.dataset.go); });
  const tg = $("#shToggle"); if (tg) tg.onclick = () => toggle(state.sel.id);
}

/* ---------- Phase bar, levels, key ---------- */
function keepFocus(fn) {
  const a = document.activeElement; let sel = null;
  if (a && a.dataset) for (const k of ["phase", "level", "flow"]) if (k in a.dataset) sel = `[data-${k}="${CSS.escape(a.dataset[k])}"]`;
  fn();
  if (sel) { const n = document.querySelector(sel); if (n) n.focus({ preventScroll: true }); }
}
function renderPhases() { keepFocus(renderPhasesNow); positionChrome(); }
function renderPhasesNow() {
  $("#phases").innerHTML = LG.phases.map((p, i) =>
    `<button class="pbtn" type="button" data-phase="${i}" aria-pressed="${i === state.phase}"><span class="l1"><b>${esc(p.id)}</b><span>${esc(p.name)}</span>${p.target ? '<span class="flag">Stage 1 target</span>' : ""}</span><span class="wk">${esc(p.weeks || "")}</span></button>`).join("");
  $("#phases").querySelectorAll("[data-phase]").forEach((b) => { b.onclick = () => setPhase(+b.dataset.phase); });
  const p = LG.phases[state.phase];
  $("#pcap").innerHTML = (p.goal ? `<span><b>Goal</b>${esc(p.goal)}</span>` : "") + (p.exit ? `<span><b>Exit test</b>${esc(p.exit)}</span>` : "");
  $("#onlyBtn").setAttribute("aria-pressed", state.only);
}
const LEVELS = [["context", "Context"], ["containers", "Containers"], ["components", "Components"], ["everything", "Everything"]];
function activeLevel() {
  const cur = new Set([...state.expanded].filter((id) => LG.kidsAll.has(id)));
  for (const [k] of LEVELS) {
    const s = LG.presetSet(k);
    if (s.size === cur.size && [...s].every((x) => cur.has(x))) return k;
  }
  return null;
}
function renderLevels() { keepFocus(renderLevelsNow); }
function renderLevelsNow() {
  const a = activeLevel();
  $("#levels").innerHTML = LEVELS.map(([k, n]) => `<button class="btn sm" type="button" data-level="${k}" aria-pressed="${a === k}">${n}</button>`).join("");
  $("#levels").querySelectorAll("[data-level]").forEach((b) => { b.onclick = async () => { await setExpanded(LG.presetSet(b.dataset.level)); touched = false; fitView(true); }; });
}
$("#expandAll").onclick = () => setExpanded(LG.presetSet("everything"));
$("#collapseAll").onclick = () => setExpanded(new Set());
$("#onlyBtn").onclick = () => { state.only = !state.only; $("#onlyBtn").setAttribute("aria-pressed", state.only); applyFocus(); };

function renderKey() {
  $("#key").innerHTML = `<h3>Kinds</h3>` + Object.entries(KINDS).map(([k, v]) =>
    `<div class="krow"><span class="stk" style="--c:${v.color}"><svg viewBox="0 0 24 24" aria-hidden="true">${v.glyph}</svg></span><span><span class="t">${esc(v.label)}</span><span class="d">${esc(v.desc)}</span></span></div>`).join("") +
    `<h3>In the selected phase</h3>` +
    `<div class="krow"><span class="chip new">New</span><span class="d">First appears in this phase (accent ring)</span></div>` +
    `<div class="krow"><span class="chip changed">Changed</span><span class="d">Exists before and changes here, see the note</span></div>` +
    `<div class="krow"><span class="chip retired">Retired</span><span class="d">Faded and struck through, gone after this phase</span></div>` +
    `<div class="krow"><span class="chip proposed">Proposed</span><span class="d">Our proposal, not in the source documents (dashed outline)</span></div>` +
    `<h3>Arrows</h3>` +
    `<div class="krow"><span class="kline"></span><span class="d">A relation. "N links" merges several hidden inside a collapsed box.</span></div>` +
    `<div class="krow"><span class="kline d"></span><span class="d">A relation that is retired in this phase</span></div>`;
}
function closePops() {
  $("#key").hidden = true; $("#keyBtn").setAttribute("aria-expanded", "false");
  $("#qpop").hidden = true; $("#q").setAttribute("aria-expanded", "false");
}
$("#keyBtn").onclick = (e) => {
  e.stopPropagation();
  const open = $("#key").hidden; closePops();
  $("#key").hidden = !open; $("#keyBtn").setAttribute("aria-expanded", String(open));
};
document.addEventListener("click", (e) => { if (!e.target.closest(".srch")) closePops(); });

/* ---------- Search ---------- */
let qItems = [], qActive = -1;
function qRender() {
  const q = $("#q").value.trim().toLowerCase(), ul = $("#qres");
  if (!q) { $("#qpop").hidden = true; $("#q").setAttribute("aria-expanded", "false"); qItems = []; return; }
  const scored = [];
  for (const o of LG.els.values()) {
    const hay = [o.name, o.tech, o.id].filter(Boolean).join(" ").toLowerCase();
    const n = (o.name || "").toLowerCase();
    let s = -1;
    if (n === q) s = 0; else if (n.startsWith(q)) s = 1; else if (n.includes(q)) s = 2; else if (hay.includes(q)) s = 3; else if ((o.desc || "").toLowerCase().includes(q)) s = 4;
    if (s >= 0) scored.push([s, !LG.shown(o.id, state.phase), o]);
  }
  scored.sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  qItems = scored.slice(0, 8).map((x) => x[2]);
  qActive = qItems.length ? 0 : -1;
  ul.innerHTML = qItems.length ? qItems.map((o, n) => {
    const vis = LG.shown(o.id, state.phase), path = LG.ancestors(o.id).reverse().map((a) => LG.els.get(a).name).join(" / ");
    return `<li role="presentation"><button class="opt" type="button" role="option" id="qo${n}" data-q="${esc(o.id)}" aria-selected="${n === qActive}"><span class="n">${esc(o.name)}</span><span class="m">${esc(kindOf(o).label)}${path ? " · " + esc(path) : ""}${vis ? "" : " · not in " + esc(LG.phases[state.phase].id) + ", opens " + esc(LG.phases[Math.max(0, firstPhaseShown(o.id))].id)}</span></button></li>`;
  }).join("") : `<li class="qnone">No element matches "${esc($("#q").value.trim())}".</li>`;
  $("#qpop").hidden = false; $("#q").setAttribute("aria-expanded", "true");
  ul.querySelectorAll("[data-q]").forEach((b) => { b.onclick = () => qPick(b.dataset.q); });
  $("#q").setAttribute("aria-activedescendant", qActive >= 0 ? "qo" + qActive : "");
}
function qPick(id) { if (firstPhaseShown(id) < 0) return; $("#q").value = ""; qRender(); $("#q").blur(); reveal(id); }
function qMove(d) {
  if (!qItems.length) return;
  qActive = (qActive + d + qItems.length) % qItems.length;
  $("#qres").querySelectorAll("[data-q]").forEach((b, n) => b.setAttribute("aria-selected", n === qActive));
  $("#q").setAttribute("aria-activedescendant", "qo" + qActive);
}
$("#q").addEventListener("input", qRender);
$("#q").addEventListener("focus", () => { if ($("#q").value.trim()) qRender(); });
$("#q").addEventListener("keydown", (e) => {
  if (e.key === "ArrowDown") { e.preventDefault(); qMove(1); }
  else if (e.key === "ArrowUp") { e.preventDefault(); qMove(-1); }
  else if (e.key === "Enter") { e.preventDefault(); if (qActive >= 0 && qItems[qActive]) qPick(qItems[qActive].id); }
  else if (e.key === "Escape") { e.stopPropagation(); $("#q").value = ""; qRender(); $("#q").blur(); }
});

/* ---------- Flow player ---------- */
const playIcon = $("#playIcon");
function showToken(on) { if (on) token.removeAttribute("hidden"); else token.setAttribute("hidden", ""); }
function setPlayIcon(on) { playIcon.innerHTML = on ? ICON.pause : ICON.play; $("#playBtn").setAttribute("aria-label", on ? "Pause" : "Play"); }
function flowsNow() {
  return LG.flowsAt(state.phase).map((f) => ({ f, steps: LG.flowSteps(f, state.phase) })).filter((x) => x.steps.length);
}
function firstFlowPhase() {
  for (let i = 0; i < LG.phases.length; i++) if (LG.flowsAt(i).some((f) => LG.flowSteps(f, i).length)) return i;
  return -1;
}
function idleCaption() {
  const fl = flowsNow();
  if (!fl.length) {
    const p = firstFlowPhase();
    cap.innerHTML = `<b>No flows in ${esc(LG.phases[state.phase].id)}</b>${p > state.phase ? `The first one appears in ${esc(LG.phases[p].id)}.` : "None are defined for this phase."}`;
  } else cap.innerHTML = `<b>Pick a flow and press play</b>Follow one journey across the map.`;
}
function renderPlayer() { keepFocus(renderPlayerNow); }
function renderPlayerNow() {
  const fl = flowsNow();
  if (!fl.some((x) => x.f.id === state.flowId)) state.flowId = fl[0] ? fl[0].f.id : null;
  $("#flows").innerHTML = fl.length ? fl.map((x) => `<button class="btn sm" type="button" data-flow="${esc(x.f.id)}" aria-pressed="${x.f.id === state.flowId}" title="${esc(x.f.desc || "")}">${esc(x.f.name)}</button>`).join("") : '<span class="none">No flows yet</span>';
  $("#flows").querySelectorAll("[data-flow]").forEach((b) => { b.onclick = () => { state.flowId = b.dataset.flow; renderPlayer(); startPlay(); }; });
  for (const id of ["#prevBtn", "#playBtn", "#nextBtn"]) $(id).disabled = !fl.length;
  setPlayIcon(false);
  idleCaption();
}
function startPlay() {
  stopPlay(true);
  const x = flowsNow().find((y) => y.f.id === state.flowId); if (!x) return;
  closePops();
  const i = state.phase, exp = state.expanded;
  const steps = x.steps.map((s) => ({ ...s, a: LG.lift(s.src, i, exp), b: LG.lift(s.dst, i, exp) })).filter((s) => s.a && s.b && L.boxes.has(s.a) && L.boxes.has(s.b));
  if (!steps.length) return;
  state.sel = null; sheet.hidden = true;
  play = { flow: x.f, steps, i: -1, running: true, timer: 0, raf: 0, bright: new Set(), edges: new Set(), current: null };
  vp.classList.add("playing"); setPlayIcon(true);
  goStep(0);
}
function stopPlay(silent) {
  if (!play) return;
  clearTimeout(play.timer); cancelAnimationFrame(play.raf);
  play = null; showToken(false); tmpl.setAttribute("d", ""); vp.classList.remove("playing");
  document.querySelectorAll(".pulse").forEach((n) => n.classList.remove("pulse"));
  if (!silent) { setPlayIcon(false); idleCaption(); applyFocus(); }
}
function pausePlay() { if (!play) return; play.running = false; clearTimeout(play.timer); setPlayIcon(false); }
function resumePlay() {
  if (!play || play.i >= play.steps.length - 1) return startPlay();
  play.running = true; setPlayIcon(true); goStep(play.i + 1);
}
function goStep(i) {
  const P = play; if (!P) return;
  clearTimeout(P.timer); cancelAnimationFrame(P.raf);
  i = Math.max(0, Math.min(P.steps.length - 1, i));
  P.bright = new Set(); P.edges = new Set();
  for (let k = 0; k <= i; k++) {
    const s = P.steps[k]; P.bright.add(s.a); P.bright.add(s.b);
    const e = L.byPair.get(s.a + "|" + s.b); if (e) P.edges.add(e.id);
  }
  const fwd = i > P.i; P.i = i;
  const s = P.steps[i]; P.current = s.b;
  document.querySelectorAll(".pulse").forEach((n) => n.classList.remove("pulse"));
  tmpl.setAttribute("d", ""); showToken(false);
  const nm = (id) => LG.els.get(id).name;
  cap.innerHTML = `<b>${esc(s.note || "Step")}</b><span class="num">Step ${i + 1} of ${P.steps.length}</span> · ${esc(nm(s.src))} → ${esc(nm(s.dst))}`;
  ensureVisible([L.boxes.get(s.a), L.boxes.get(s.b)], 600);
  applyFocus();
  if (s.a === s.b) {
    const el = (frameEls.get(s.a) || cardEls.get(s.a));
    if (el) { void el.offsetWidth; el.classList.add("pulse"); }
  } else if (fwd && !reduced) {
    const e = L.byPair.get(s.a + "|" + s.b);
    let path = e && egG.querySelector(`.eg[data-id="${CSS.escape(e.id)}"] .e`);
    if (!path) {
      const a = L.boxes.get(s.a), b = L.boxes.get(s.b);
      const p0 = clipTo(a, [b.x + b.w / 2, b.y + b.h / 2]), p1 = clipTo(b, [a.x + a.w / 2, a.y + a.h / 2]);
      tmpl.setAttribute("d", `M${p0[0]},${p0[1]} L${p1[0]},${p1[1]}`);
      path = tmpl;
    }
    moveToken(path, 700);
  }
  if (P.running) P.timer = setTimeout(() => (i < P.steps.length - 1 ? goStep(i + 1) : finishPlay()), 2200);
}
function finishPlay() {
  const P = play; if (!P) return;
  P.running = false; setPlayIcon(false); showToken(false);
  cap.innerHTML = `<b>End of "${esc(P.flow.name)}"</b>${P.steps.length} steps. Press play to run it again.`;
}
function moveToken(path, ms) {
  const len = path.getTotalLength(), t0 = performance.now(), c = token.firstElementChild;
  showToken(true);
  const tick = (now) => {
    const k = Math.min(1, (now - t0) / ms), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    const p = path.getPointAtLength(len * e);
    c.setAttribute("cx", p.x); c.setAttribute("cy", p.y);
    if (k < 1 && play) play.raf = requestAnimationFrame(tick); else showToken(false);
  };
  play.raf = requestAnimationFrame(tick);
}
$("#playBtn").onclick = () => { if (!play) startPlay(); else if (play.running) pausePlay(); else resumePlay(); };
$("#nextBtn").onclick = () => { if (!play) { startPlay(); pausePlay(); return; } pausePlay(); goStep(play.i + 1); };
$("#prevBtn").onclick = () => { if (!play) { startPlay(); pausePlay(); return; } pausePlay(); goStep(play.i - 1); };

/* ---------- Zoom bar, keys, resize ---------- */
$("#zoomIn").onclick = () => zoomAt(innerWidth / 2, innerHeight / 2, view.z * 1.25);
$("#zoomOut").onclick = () => zoomAt(innerWidth / 2, innerHeight / 2, view.z / 1.25);
$("#fitBtn").onclick = () => { touched = false; fitView(true); };
addEventListener("keydown", (e) => {
  const typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement && document.activeElement.tagName);
  if (e.key === "Escape") {
    if (!$("#key").hidden || !$("#qpop").hidden) { closePops(); return; }
    if (typing) document.activeElement.blur();
    if (play) stopPlay(); else deselect();
    return;
  }
  if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === "+" || e.key === "=") zoomAt(innerWidth / 2, innerHeight / 2, view.z * 1.25);
  else if (e.key === "-") zoomAt(innerWidth / 2, innerHeight / 2, view.z / 1.25);
  else if (e.key === "0") { touched = false; fitView(true); }
  else if (e.key === "/") { e.preventDefault(); $("#q").focus(); }
});
let touched = false, rzT = 0;
addEventListener("resize", () => { clearTimeout(rzT); rzT = setTimeout(() => { positionChrome(); if (!touched && !play) fitView(false); }, 80); });

/* ---------- Start ---------- */
renderPhases(); renderLevels(); renderKey(); renderPlayer();
positionChrome();
relayout({ fit: true, animate: false }).then((ok) => { if (ok) fitView(false); });
if (document.fonts && document.fonts.addEventListener) {
  let fontT = 0;
  document.fonts.addEventListener("loadingdone", () => { clearTimeout(fontT); fontT = setTimeout(() => { if (L && !play) relayout({ animate: false }); }, 120); });
}
}

boot();
})();
</script>
</body>
