name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: For a security problem use the private report link on the issue chooser, not this form.
  - type: textarea
    id: what
    attributes: { label: What happened, description: What you did, what you expected, what you got }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Steps to reproduce, placeholder: '1. Sign in as ...\n2. Open ...' }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: Version or commit }
  - type: textarea
    id: logs
    attributes:
      { label: Logs or screenshots, description: Remove passwords, tokens and personal data first }
