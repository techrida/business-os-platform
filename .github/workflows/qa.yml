# Browser QA on GitHub-hosted runners: the whole stack (containers + compiled apps, devtools profile) is brought up
# by .github/qa/up.sh, the dev personas are seeded, and the Playwright specs of apps/workspace and apps/portal run
# against it. Videos, screenshots and the HTML report are uploaded as artifacts.
# A pull request runs only the browser suites its diff affects (job `changes`, tools/affected.mjs): workspace specs for
# the workspace app and what it depends on, portal specs for the portal, both for the API. Pushes, the weekly schedule
# and manual runs run everything. Only `qa required` is the required check; it always reports.
# Standard runners only (free for public repositories): never switch `runs-on` to a larger runner, those are billed.
name: qa

on:
  workflow_dispatch:
    inputs:
      shard_ceiling:
        description: Maximum workspace shards for a hosted timing comparison
        type: choice
        options: ['14', '10', '6']
        default: '10'
      spec_filter:
        description: 'Playwright file filter (a path or regex, empty = all), e.g. p4/list-filters'
        required: false
        default: ''
      repeat_each:
        description: 'Run each selected spec this many times (a stability check of new specs), e.g. 3'
        required: false
        default: '1'
  push:
    branches: [main]
  # Weekly full run: catches anything the per-pull-request selection (tools/affected.mjs) missed.
  schedule:
    - cron: '47 3 * * 1'
  # Every pull request, with no path filter: the required `qa required` check must report on a docs-only or
  # tools-only PR too, or the PR waits for it forever.
  pull_request:
    branches: [main, 'kuu/release-*']

permissions:
  contents: read

concurrency:
  group: qa-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  QA_SHARD_CEILING: ${{ inputs.shard_ceiling || '10' }}
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  changes:
    name: changes (what this run covers)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # `actions: read` lets the selector ask for earlier runs of this workflow on the same commit (same-commit skip).
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.affected.outputs.skip }}
      qa-workspace: ${{ steps.affected.outputs.qa-workspace }}
      qa-portal: ${{ steps.affected.outputs.qa-portal }}
      parallel: ${{ steps.capacity.outputs.count || '1' }}
      count: ${{ inputs.shard_ceiling || steps.capacity.outputs.count || '1' }}
      qa-matrix: ${{ steps.shards.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # No later step pushes, so the token is not left in .git/config.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # The selector decides what is tested, so a pull request must not be able to edit it. The copy on the base commit
      # replaces the one in the checkout; a change to tools/ or .github/ runs everything under that copy anyway.
      - name: Use the selector from the base commit
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git show "$BASE_SHA:tools/affected.mjs" > tools/affected.mjs

      - name: Map the diff to areas
        id: affected
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Same-commit skip: a push run of this workflow that already succeeded for this commit means nothing runs again.
          BOS_SKIP_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BOS_SKIP_WORKFLOW: qa.yml
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/affected.mjs --base "$BASE_SHA" --head "$HEAD_SHA" --github-output

      - name: Count available hosted runner slots
        id: capacity
        if: steps.affected.outputs.qa-workspace == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(node tools/qa-capacity.mjs)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Selected $count workspace shards (ceiling $QA_SHARD_CEILING)." >> "$GITHUB_STEP_SUMMARY"

      - name: Balance selected workspace specs
        id: shards
        env:
          QA_SHARDS: ${{ inputs.shard_ceiling || steps.capacity.outputs.count || '1' }}
          SELECTED: ${{ steps.affected.outputs.qa-matrix }}
        run: node tools/qa-shards.mjs --matrix

  fixtures:
    env:
      QA_SHARDS: ${{ needs.changes.outputs.count }}
    permissions:
      contents: read
      packages: write
    name: Build QA fixtures
    outputs:
      reused: ${{ steps.snapshot.outputs.cache-hit }}
    needs: changes
    if: ${{ (needs.changes.outputs.qa-workspace == 'true' || needs.changes.outputs.qa-portal == 'true') && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select an encrypted snapshot by its fixture inputs
        id: snapshot-key
        env:
          QA_FIXTURE_KEY: ${{ secrets.QA_FIXTURE_KEY }}
        run: node tools/qa-fixture-key.mjs >> "$GITHUB_OUTPUT"

      - name: Restore encrypted QA fixture snapshot
        id: snapshot
        if: github.ref != 'refs/heads/main' && github.base_ref != 'main' && github.event_name != 'schedule'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/fixtures.gpg
          key: ${{ steps.snapshot-key.outputs.key }}

      - name: Authenticate cached snapshot and extract approval samples
        if: steps.snapshot.outputs.cache-hit == 'true'
        env:
          QA_FIXTURE_KEY: ${{ secrets.QA_FIXTURE_KEY }}
        run: bash .github/qa/snapshot.sh check

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: steps.snapshot.outputs.cache-hit != 'true'
        with:
          version: 11.29.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.snapshot.outputs.cache-hit != 'true'
        with:
          node-version: 24
          cache: pnpm

      - run: node tools/qa-shards.mjs
        if: steps.snapshot.outputs.cache-hit != 'true'

      - name: Install
        if: steps.snapshot.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - uses: ./.github/actions/qa-cache
        if: steps.snapshot.outputs.cache-hit != 'true'
        with:
          mode: publish

      - name: Bring up the stack and seed the dev personas
        if: steps.snapshot.outputs.cache-hit != 'true'
        run: bash .github/qa/up.sh

      # Needs the stack's files (.dev/caddy-root.crt, .dev/personas.json): Playwright's config and personas.spec.ts read them while
      # listing tests. Still minutes before the first spec runs.
      - name: Every workspace spec is in exactly one shard list
        if: steps.snapshot.outputs.cache-hit != 'true'
        run: node .github/qa/spec-counts.mjs --lists

      - uses: ./.github/actions/qa-fixtures
        if: steps.snapshot.outputs.cache-hit != 'true'

      - uses: ./.github/actions/qa-timings
        if: github.event_name == 'pull_request' && github.base_ref == 'main' && startsWith(github.head_ref, 'kuu/release-')
        with:
          lane: fixtures

      - name: Encrypt fixture databases and sign-in state
        if: steps.snapshot.outputs.cache-hit != 'true'
        env:
          QA_FIXTURE_KEY: ${{ secrets.QA_FIXTURE_KEY }}
        run: bash .github/qa/snapshot.sh save

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: qa-fixtures
          path: ${{ runner.temp }}/fixtures.gpg
          retention-days: 1
          overwrite: true
          if-no-files-found: error

      - name: Preserve approval timings for the dispatch gate
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: qa-approval-samples
          path: .dev/qa-approve-timings.jsonl
          include-hidden-files: true
          if-no-files-found: error

      # The fixtures time every Approve they click (e2e/helpers/fixture-flow.ts). The job fails when the p95 of the
      # successful Approves is over 80 ms (Kuu 2026-11-26); the repository variable QA_APPROVE_P95_LIMIT_MS overrides
      # the limit without a commit.
      - name: Approve to decided page
        if: ${{ !cancelled() && (github.base_ref == 'main' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) }}
        env:
          BOS_APPROVE_P95_LIMIT_MS: ${{ vars.QA_APPROVE_P95_LIMIT_MS }}
        run: node .github/qa/approve-timing.mjs .dev/qa-approve-timings.jsonl >> "$GITHUB_STEP_SUMMARY"

      - uses: ./.github/actions/qa-reports
        if: ${{ !cancelled() && steps.snapshot.outputs.cache-hit != 'true' }}
        with:
          lane: fixtures

  workspace:
    env:
      QA_SHARDS: ${{ needs.changes.outputs.count }}
    permissions:
      contents: read
      packages: read
    name: qa ${{ matrix.mode }} ${{ matrix.id }}
    needs: [changes, fixtures]
    # An empty matrix is an error, so a diff that touches neither app skips the job instead.
    if: ${{ !cancelled() && needs.changes.result == 'success' && (needs.fixtures.result == 'success' || needs.fixtures.result == 'skipped') && (needs.changes.outputs.qa-workspace == 'true' || needs.changes.outputs.qa-portal == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    continue-on-error: ${{ matrix.mode == 'quarantined' }}
    strategy:
      max-parallel: ${{ fromJSON(needs.changes.outputs.parallel) }}
      fail-fast: false
      # Computed by tools/affected.mjs: the full set (specs 1 and 2, plus quarantined when something is quarantined), or one
      # specs 2 job that runs only the portal specs (ws: false) when only the portal is affected.
      matrix: ${{ fromJSON(needs.changes.outputs.qa-matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.29.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: node tools/qa-shards.mjs

      - name: Install
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        if: needs.fixtures.result == 'success'
        with:
          name: qa-fixtures
          path: ${{ runner.temp }}

      - name: Decrypt fixture state
        if: needs.fixtures.result == 'success'
        env:
          QA_FIXTURE_KEY: ${{ secrets.QA_FIXTURE_KEY }}
        run: bash .github/qa/snapshot.sh unpack

      - uses: ./.github/actions/qa-cache
        with:
          mode: ${{ needs.fixtures.result == 'success' && 'pull' || 'local' }}

      - name: Start shard stack
        env:
          MODE: ${{ needs.fixtures.result == 'success' && 'restore' || 'seed' }}
        run: bash .github/qa/up.sh "$MODE"

      - uses: ./.github/actions/qa-fixtures
        if: needs.fixtures.result == 'skipped'

      - name: Check current workspace spec coverage on a restored snapshot
        if: needs.fixtures.outputs.reused == 'true' && matrix.ws && matrix.id == '1'
        run: node .github/qa/spec-counts.mjs --lists

      - name: Renew portal sessions from cached fixtures
        if: needs.fixtures.outputs.reused == 'true'
        env:
          BOS_E2E_BRANDED_LOGIN: '1'
          BOS_DEV_PERSONAS_FILE: ${{ github.workspace }}/.dev/personas.json
          NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/.dev/caddy-root.crt
        working-directory: apps/workspace
        run: |
          pnpm exec playwright test --project=dev p4/qa-fixtures.spec --grep 'qa fixtures: portal sign-in state' --fully-parallel --workers=4

      # The env-gated specs (BOS_E2E_P4 and the *_ID variables) run against these fixtures instead of skipping.
      - name: Export the fixture ids to the spec environment
        run: bash .github/qa/export-ids.sh

      # With a spec filter set both Playwright steps pass with no tests, so a mistyped filter would pass silently: print how
      # many tests each step runs and fail when the filter matched none in either suite (.github/qa/spec-counts.mjs).
      - name: Spec filter matches at least one test
        if: ${{ inputs.spec_filter != '' && matrix.mode == 'specs' }}
        env:
          NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/.dev/caddy-root.crt
          BOS_DEV_PERSONAS_FILE: ${{ github.workspace }}/.dev/personas.json
          SPEC_FILTER: ${{ inputs.spec_filter }}
          REPEAT_EACH: ${{ inputs.repeat_each || '1' }}
          SHARD: ${{ matrix.shard }}
        run: node .github/qa/spec-counts.mjs

      - name: Playwright (workspace, dev project)
        if: ${{ matrix.mode == 'specs' && matrix.ws }}
        env:
          BOS_E2E_RECORD: '1'
          # The compiled devtools build carries the dev switcher and the dev shell, like `next dev`; the login is the Business OS image.
          BOS_E2E_NEXT_DEV: '1'
          BOS_E2E_BRANDED_LOGIN: '1'
          NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/.dev/caddy-root.crt
          BOS_DEV_PERSONAS_FILE: ${{ github.workspace }}/.dev/personas.json
          SPEC_FILTER: ${{ inputs.spec_filter }}
          REPEAT_EACH: ${{ inputs.repeat_each || '1' }}
          SHARD: ${{ matrix.shard }}
          LIST: ${{ matrix.list }}
        run: |
          cd apps/workspace
          skip="persona sign-in and sign-out|qa fixtures: "
          # An empty quarantine file must add nothing: a trailing "|" would match, and so skip, every test.
          quarantine="$(cat ../../.github/qa/quarantine.txt)"
          if [ -n "$quarantine" ]; then skip="$skip|$quarantine"; fi
          # The filter is split into words by read, which never expands a * or ? against files on disk; an empty value
          # gives no words. Each word is a Playwright file filter.
          read -r -a filter <<< "$SPEC_FILTER"
          # The persona sign-ins already ran in the warm-up step.
          # A filter naming only portal specs matches nothing here: with a filter set, no tests is not a failure. A filter
          # is split between the two jobs by Playwright's --shard; with no filter the job runs its own file list.
          extra=()
          shard=(--shard="$SHARD")
          targets=("${filter[@]}")
          if [ "${#filter[@]}" -gt 0 ]; then
            extra+=(--pass-with-no-tests)
          elif [ -n "$LIST" ]; then
            mapfile -t targets < "../../.github/qa/$LIST.txt"
            shard=()
          fi
          pnpm exec playwright test --project=dev "${shard[@]}" --repeat-each="$REPEAT_EACH" --grep-invert "$skip" "${extra[@]}" "${targets[@]}"

      - name: Playwright (quarantined specs, informational)
        if: ${{ matrix.mode == 'quarantined' }}
        env:
          BOS_E2E_RECORD: '1'
          BOS_E2E_NEXT_DEV: '1'
          BOS_E2E_BRANDED_LOGIN: '1'
          NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/.dev/caddy-root.crt
          BOS_DEV_PERSONAS_FILE: ${{ github.workspace }}/.dev/personas.json
        run: |
          cd apps/workspace
          # A shorter test limit: these fail by timeout, and 4 minutes each would run the job for half an hour.
          quarantine="$(cat ../../.github/qa/quarantine.txt)"
          if [ -z "$quarantine" ]; then echo "Nothing is quarantined."; exit 0; fi
          pnpm exec playwright test --project=dev --timeout=60000 --grep "$quarantine"

      - name: Portal specs (they skip themselves without their fixtures)
        # A matrix from the selector of an older base commit has no `portal` flag: its shard 1 ran the portal specs.
        if: ${{ !cancelled() && matrix.mode == 'specs' && (matrix.portal || (!matrix.list && matrix.id == '1')) }}
        env:
          PORTAL_E2E_BASE_URL: https://portal.localhost
          NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/.dev/caddy-root.crt
          # The Journey 11 upload round trip signs in to the workspace as procurement and accountant.
          BOS_E2E_BRANDED_LOGIN: '1'
          BOS_DEV_PERSONAS_FILE: ${{ github.workspace }}/.dev/personas.json
          SPEC_FILTER: ${{ inputs.spec_filter }}
          REPEAT_EACH: ${{ inputs.repeat_each || '1' }}
        # The same file filter and repeat count as the workspace run. A filter naming only workspace specs matches
        # nothing here, so --pass-with-no-tests applies when a filter is set; with no filter, no tests is a failure.
        run: |
          read -r -a filter <<< "$SPEC_FILTER"
          extra=()
          if [ "${#filter[@]}" -gt 0 ]; then extra+=(--pass-with-no-tests); fi
          pnpm --filter @bos/portal exec playwright test --repeat-each="$REPEAT_EACH" "${extra[@]}" "${filter[@]}"

      # The fixtures time every Approve they click (e2e/helpers/fixture-flow.ts). The job fails when the p95 of the
      # successful Approves is over 80 ms (Kuu 2026-11-26); the repository variable QA_APPROVE_P95_LIMIT_MS overrides
      # the limit without a commit.
      - name: Approve to decided page
        if: ${{ needs.fixtures.result == 'skipped' && !cancelled() && (github.base_ref == 'main' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch') }}
        env:
          BOS_APPROVE_P95_LIMIT_MS: ${{ vars.QA_APPROVE_P95_LIMIT_MS }}
        run: node .github/qa/approve-timing.mjs .dev/qa-approve-timings.jsonl >> "$GITHUB_STEP_SUMMARY"

      - uses: ./.github/actions/qa-timings
        if: github.event_name == 'pull_request' && github.base_ref == 'main' && startsWith(github.head_ref, 'kuu/release-')
        with:
          lane: ${{ matrix.mode }}-${{ matrix.id }}

      - uses: ./.github/actions/qa-reports
        if: ${{ !cancelled() }}
        with:
          lane: ${{ matrix.mode }}-${{ matrix.id }}

      - name: Directory diagnostics on failure (counts only)
        if: ${{ failure() }}
        run: |
          q() { docker compose --env-file .env -f infra/compose/compose.yaml -f infra/compose/compose.dev.yaml -f .github/qa/compose.qa.yaml exec -T postgres psql -U postgres -d bos -P pager=off -c "$1" || true; }
          q "select count(*) users from app.users"
          q "select ue.level, ue.role_keys, (ue.department_id is not null) has_dept, count(*) from app.user_entities ue group by 1,2,3"
          q "select status, count(*) from app.users group by 1"
          q "select role_key, scope, count(*) from app.role_permissions where permission='approvals.requests.act' group by 1,2"
          q "select ur.role_key, count(*) from app.user_roles ur group by 1 order by 1"

      - name: Stack logs on failure (env files are never printed)
        if: ${{ failure() }}
        run: |
          for f in .dev/logs/*.log .dev/compose-up.log; do echo "::group::$f"; tail -n 80 "$f" || true; echo "::endgroup::"; done
          docker compose --env-file .env -f infra/compose/compose.yaml -f infra/compose/compose.dev.yaml -f .github/qa/compose.qa.yaml ps -a || true

  # The one required check. It always runs, so a skipped suite never leaves a pull request waiting; it fails when
  # any job failed or was cancelled, and passes when every job succeeded or was skipped.
  qa-required:
    name: qa required
    if: ${{ always() }}
    needs: [changes, fixtures, workspace]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && needs.fixtures.result == 'success' || github.event_name == 'pull_request' && github.base_ref == 'main' && startsWith(github.head_ref, 'kuu/release-') && needs.workspace.result == 'success'
        with:
          persist-credentials: false

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        if: github.event_name == 'pull_request' && github.base_ref == 'main' && startsWith(github.head_ref, 'kuu/release-') && needs.workspace.result == 'success'
        with:
          pattern: qa-timings-*
          path: ${{ runner.temp }}/timings

      - name: Gate combined page and API timings
        if: github.event_name == 'pull_request' && github.base_ref == 'main' && startsWith(github.head_ref, 'kuu/release-') && needs.workspace.result == 'success'
        run: |
          cd "$RUNNER_TEMP/timings"
          cat */page.jsonl > pages.jsonl
          cat */api.jsonl > api.jsonl
          node "$GITHUB_WORKSPACE/.github/qa/flow-summary.mjs" --gate pages.jsonl api.jsonl >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && needs.fixtures.result == 'success'
        with:
          name: qa-approval-samples
          path: ${{ runner.temp }}/approval

      - name: Check dispatch fixture approval timings
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && needs.fixtures.result == 'success'
        env:
          BOS_APPROVE_P95_LIMIT_MS: ${{ vars.QA_APPROVE_P95_LIMIT_MS }}
        run: node .github/qa/approve-timing.mjs "$RUNNER_TEMP/approval/qa-approve-timings.jsonl" >> "$GITHUB_STEP_SUMMARY"

      - name: Every needed job succeeded or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) echo "a job failed or was cancelled"; exit 1 ;;
          esac
