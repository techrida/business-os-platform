# Continuous integration for the Business OS monorepo (ADR 0016).
#
# Every job must pass for a pull request to merge. Nothing here is allowed to fail:
# no step is marked as tolerating failure, on purpose.
#
# A pull request runs only the jobs its diff affects (job `changes`, tools/affected.mjs); a skipped job counts as
# passed. Pushes, the weekly schedule and manual runs run everything. Only `ci required` is the required check:
# it always reports and fails when any job failed or was cancelled.
#
# Every third-party action is pinned to a full commit SHA (the comment beside it names the release),
# because a tag can be moved after the fact. Dependabot (github-actions ecosystem) can bump the SHA.
# Container images are pinned by digest too; `infra/scripts/check-image-pins.mjs` enforces that.
name: ci

on:
  push:
    branches:
      - main
      - p4-main
      - 'p*/**'
      - 'p[1-4]-main'
      - 'r6/**'
      - 'kuu/**'
  pull_request:
  workflow_dispatch:
  # Weekly full run: catches anything the per-pull-request selection (tools/affected.mjs) missed.
  schedule:
    - cron: '17 3 * * 1'

# The least privilege that lets the jobs read the code. No job here writes to the repo,
# the registry or pull requests.
permissions:
  contents: read

# A newer push to the same branch or pull request cancels the older run, so the queue never
# fills with results nobody will read.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # pnpm's own prompts would hang a job with no terminal.
  CI: 'true'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  # Which areas does this pull request touch? Reads package.json files only (no install), so it takes seconds.
  changes:
    name: changes (what this run covers)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      full: ${{ steps.affected.outputs.full }}
      api: ${{ steps.affected.outputs.api }}
      workspace: ${{ steps.affected.outputs.workspace }}
      portal: ${{ steps.affected.outputs.portal }}
      db: ${{ steps.affected.outputs.db }}
      web: ${{ steps.affected.outputs.web }}
      docker: ${{ steps.affected.outputs.docker }}
      docs-only: ${{ steps.affected.outputs.docs-only }}
      packages: ${{ steps.affected.outputs.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The diff needs the base commit as well as the head.
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Map the diff to areas
        id: affected
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node tools/affected.mjs --base "$BASE_SHA" --head "$HEAD_SHA" --github-output

  # Fast gate: types, lint, unit tests, formatting. No containers started by this repo's
  # own compose files. Note `pnpm test` runs every workspace package's `test` script.
  checks:
    name: checks (typecheck, lint, unit, format)
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Order matters: pnpm must exist before setup-node asks it for the store path (cache: pnpm).
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.29.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install (lockfile must match every package.json)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint (zero warnings allowed)
        run: pnpm lint

      # A pull request runs the unit tests of the changed packages and the packages that depend on them (the
      # `packages` output, see tools/affected.mjs); everything else runs them all. Typecheck, lint and format stay
      # whole-repo: they take about 4 minutes together and catch what selection cannot.
      - name: Unit tests
        if: ${{ needs.changes.outputs.docs-only != 'true' }}
        env:
          FULL: ${{ needs.changes.outputs.full }}
          AFFECTED: ${{ needs.changes.outputs.packages }}
        run: |
          if [ "$FULL" = "true" ]; then
            pnpm test
          else
            args=()
            for name in $AFFECTED; do args+=(--filter "$name"); done
            pnpm "${args[@]}" -r --if-present run test
          fi

      - name: Format check
        run: pnpm format:check

      # Fails if any compose `image:` or Dockerfile `FROM` is not pinned by @sha256 digest (supply chain).
      - name: Container images are pinned by digest
        run: node infra/scripts/check-image-pins.mjs

      # Tracked files must be fit for a public repository (license fields, no private paths); same step as tools/gate.sh.
      - name: Public-repo check
        run: node --test tools/check-public-repo.test.mjs infra/pnpm-bootstrap.test.mjs tools/qa-workflow.test.mjs tools/affected.test.mjs tools/qa-approve-timing.test.mjs tools/qa-spec-counts.test.mjs && node tools/check-public-repo.mjs

  # Scans the whole git history for committed secrets. Config: .gitleaks.toml (test fixtures only).
  # Runs the open-source gitleaks CLI directly (the gitleaks-action wrapper needs a GITLEAKS_LICENSE
  # secret on organisation repos). The release tarball is pinned by sha256, taken from the release's
  # gitleaks_8.30.1_checksums.txt; a mismatch fails the job before anything is executed.
  secrets:
    name: secrets (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: a secret removed in a later commit is still leaked.
          fetch-depth: 0

      - name: Install gitleaks 8.30.1 (sha256-pinned)
        run: |
          set -euo pipefail
          curl -sSfL --retry 3 -o gitleaks.tar.gz             https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/gitleaks"
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP/gitleaks" gitleaks
          rm gitleaks.tar.gz

      - name: Scan full history
        # --redact keeps any finding's secret out of the job log; exit code 1 fails the job.
        # --log-opts=HEAD scans every commit this checkout's history holds, not every fetched
        # branch (gitleaks' default is --all), so another phase branch's finding fails that
        # branch's own CI instead of every PR.
        run: >-
          "$RUNNER_TEMP/gitleaks/gitleaks" git --log-opts=HEAD
          --config .gitleaks.toml --redact --exit-code 1 --no-banner .

  # Real Postgres through Testcontainers (it starts throw-away Docker containers from inside
  # the tests). ubuntu-24.04 runners already have Docker, so nothing extra to install.
  e2e:
    name: e2e (db tenancy, api auth)
    needs: changes
    if: ${{ needs.changes.outputs.full == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.db == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.29.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Database tests (migrations, tenancy check)
        run: pnpm --filter @bos/db test

      - name: API end-to-end tests
        run: pnpm --filter @bos/api test:e2e

      # NOT run in CI: the Playwright browser tests (apps/workspace/e2e). They log in through the real
      # ZITADEL, Caddy and Postgres stack (compose `core` + `app` profiles, seeded), which this job does not
      # start; that needs the full stack and a local CA. Until a CI stack exists they run on the dev machine
      # only (CR-09), so a green `e2e` job here does not mean the browser login flows were exercised.

  # Builds the production Next.js app, then proves the dev-only persona pages are not in it.
  web:
    name: web (build, no dev routes)
    needs: changes
    if: ${{ needs.changes.outputs.full == 'true' || needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.29.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # `@bos/workspace...` = the app plus the workspace packages it depends on.
      # Next's compiler cache: unchanged files are not recompiled.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apps/workspace/.next/cache
            apps/portal/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/workspace/src/**', 'apps/portal/src/**', 'packages/*/src/**') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            next-${{ runner.os }}-

      - name: Build the workspace app (production)
        env:
          BOS_BUILD_PROFILE: production
        run: pnpm --filter '@bos/workspace...' build

      # No existence guard on purpose: a missing checker is an error (node exits 1), never a silent skip.
      # The checker itself exits 2 when there is no build output to inspect.
      - name: Check no dev routes in the production build
        run: node apps/workspace/scripts/check-no-dev-routes.mjs

      # Both product apps must ship without dev routes or tooling.
      - name: Build the portal app (production)
        run: pnpm --filter '@bos/portal...' build

      - name: Check no dev tooling in the portal production build
        run: node apps/workspace/scripts/check-no-dev-routes.mjs apps/portal/.next

  # Proves the production images still build. Nothing is pushed anywhere.
  docker:
    name: docker (build production images)
    needs: changes
    if: ${{ needs.changes.outputs.full == 'true' || needs.changes.outputs.docker == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The build context is the repo root (the Dockerfiles need pnpm-lock.yaml and packages/*).
      # Each image has its own cache scope so one image's layers don't evict the other's.
      - name: Build api image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      # load: true keeps the image in the runner's Docker so the next step can look inside it.
      - name: Build workspace image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/workspace/Dockerfile
          push: false
          load: true
          tags: bos/workspace:ci
          cache-from: type=gha,scope=workspace
          cache-to: type=gha,scope=workspace,mode=max

      # The `web` job checks the build on the runner; this checks what actually ships. The image has no source
      # and the runtime stage has no checker, so the checker is mounted read-only from the checkout and run with
      # the image's own Node against the image's .next folder. It exits 1 on a dev route, and 2 when the folder
      # is not a finished build, which fails the step too.
      - name: Check no dev routes in the workspace image
        run: |
          docker run --rm \
            -v "$PWD/apps/workspace/scripts/check-no-dev-routes.mjs:/check/check-no-dev-routes.mjs:ro" \
            --entrypoint node \
            bos/workspace:ci \
            /check/check-no-dev-routes.mjs /app/apps/workspace/.next

      # Same shape as the workspace image, with its own cache scope. Not loaded or tagged: nothing inspects it yet.
      - name: Build portal image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/portal/Dockerfile
          push: false
          cache-from: type=gha,scope=portal
          cache-to: type=gha,scope=portal,mode=max

      - name: Test Login V2 forms
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/login/Dockerfile
          target: test
          push: false
          cache-from: type=gha,scope=login
          cache-to: type=gha,scope=login-test,mode=max

      - name: Build Login V2 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/login/Dockerfile
          push: false
          cache-from: type=gha,scope=login
          cache-to: type=gha,scope=login,mode=max

  # The one required check. It always runs, so a skipped job never leaves a pull request waiting; it fails when
  # any job failed or was cancelled, and passes when every job succeeded or was skipped.
  ci-required:
    name: ci required
    if: ${{ always() }}
    needs: [changes, checks, secrets, e2e, web, docker]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every needed job succeeded or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) echo "a job failed or was cancelled"; exit 1 ;;
          esac
