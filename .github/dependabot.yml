version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: p4-main
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    # pdfjs-dist is pinned at 4.5.136 for iOS Safari 15 (see pnpm-workspace.yaml); majors are not taken by PR.
    ignore:
      - dependency-name: pdfjs-dist
        update-types: ['version-update:semver-major']
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    target-branch: p4-main
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: docker
    directories:
      - /apps/api
      - /apps/portal
      - /apps/workspace
      - /infra/login
      - /infra/postgres
    target-branch: p4-main
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    # A Postgres major changes the on-disk format of existing volumes: upgrade it deliberately, never by PR.
    ignore:
      - dependency-name: postgres
        update-types: ['version-update:semver-major']
    groups:
      images:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /infra/pnpm-bootstrap
    target-branch: p4-main
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 1
