# clamd (ClamAV scan daemon) settings for the `files` profile. Mounted read-only at /etc/clamav/clamd.conf.
# Serves NFR Security (uploads are scanned before anyone can download them) and Availability on a 9 GB machine
# (settings below keep memory predictable). The image's own default conf is replaced by this file.

# TCP port the API and worker talk to (INSTREAM over the network, so the two containers need no shared files).
TCPSocket 3310
# Listen on every interface of the container; the compose networks decide who can reach it.
TCPAddr 0.0.0.0
# Also keep a unix socket: the image's clamdcheck.sh and clamdscan may use the socket named in this file.
LocalSocket /tmp/clamd.sock

# Stay in the foreground so the container's main process is clamd and logs reach `docker logs`.
Foreground yes
# Drop root after start; the image creates this user.
User clamav

# The image's own log path. /dev/stdout does not work here: as user clamav, clamd fails with
# "Failed to open log file /dev/stdout: Symbolic link loop" and exits (seen 2026-11-08).
# Read it with: docker compose ... exec clamav tail -f /var/log/clamav/clamd.log
LogFile /var/log/clamav/clamd.log
# Rotate at 2 MB so the container's log file stays small.
LogFileMaxSize 2M
LogRotate yes
# Timestamps on each line.
LogTime yes
# Do not log syslog as well.
LogSyslog no

# Signatures live in the clamav-db volume (freshclam writes them there too).
DatabaseDirectory /var/lib/clamav

# The upload cap is 25 MiB. clamd's default StreamMaxLength is 25M, so a file at the cap would be cut off with
# "INSTREAM size limit exceeded". 30M leaves headroom for the cap plus chunk framing.
StreamMaxLength 30M

# A reload with the default (yes) keeps two copies of the signatures in memory: about 2.4 GiB peak against
# about 1.2 GiB. `no` keeps us under the 1792 MiB limit; the price is that scans wait during the short reload.
ConcurrentDatabaseReload no

# Scan threads. Four is plenty for a small team and bounds the extra memory each scan can use.
MaxThreads 4

# Archives and streams that go over a scan limit (MaxFileSize, MaxScanSize, MaxFiles, MaxRecursion; the limits
# stay at clamd's defaults) are reported as "Heuristics.Limits.Exceeded FOUND" instead of being passed as OK.
# Without this a zip bomb or a deeply nested archive that clamd gave up on would come back clean (review R20).
# ClamdClient maps that FOUND to `infected`, so the file is blocked. Takes effect only after clamd restarts.
AlertExceedsMax yes

# Refuse the SHUTDOWN command. Anything that can reach port 3310 could otherwise stop the scanner, and uploads
# would then wait or fail. The daemon still stops on SIGTERM (container stop) and reloads on RELOAD or freshclam.
EnableShutdownCommand no
