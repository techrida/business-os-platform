# freshclam (ClamAV signature updater) settings for the `files` profile. Mounted read-only at
# /etc/clamav/freshclam.conf. Serves NFR Security (fresh signatures) within the memory budget (compose.yaml).

# Same directory clamd reads; the clamav-db volume is mounted here.
DatabaseDirectory /var/lib/clamav

# ClamAV's public CDN (content delivery network) mirror. The container needs outbound internet for this.
DatabaseMirror database.clamav.net

# Default is yes: freshclam would load each new database to test it, which costs a second in-memory copy.
# clamd verifies the files itself when it reloads, so we skip the extra copy.
TestDatabases no

# Update checks per day. Two is enough for a staff-only app and polite to the mirror.
Checks 2

# Tell clamd to reload when new signatures arrive (it reads its address from this file).
NotifyClamd /etc/clamav/clamd.conf

# Log to the terminal so `docker logs` shows updates.
Foreground yes
