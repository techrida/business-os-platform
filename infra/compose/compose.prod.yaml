# Prod overlay: use together with compose.yaml, always with --env-file .env (see the header of compose.yaml).
#   docker compose --env-file .env -f infra/compose/compose.yaml -f infra/compose/compose.prod.yaml --profile core --profile app --profile files up -d --wait
#
# Add `--profile obs` to start the metrics stack (Prometheus and friends); `--profile files` starts ClamAV, which the
# upload scan needs. Without it, uploads stay unscanned.
#
# P0 production serves admin sign-in over HTTPS through Caddy and ZITADEL.
# BIND_ADDR selects the server interface. Remote host administration is a separate open decision.
# Set AUTH_HOST, APP_HOST, API_HOST and PORTAL_HOST in .env to the real domains. Nothing is published except Caddy.
# Not verified until that server exists (no prod run happened in P0).
#
# Hardening still to do before real data (tracked for P1):
#   - split ZITADEL into init / setup / start (see the "prodlike" overlay in ZITADEL's deploy/compose)
#   - delete admin.pat plus the bootstrap service account after setup: `seed-zitadel ... --finalize` does it (see compose.yaml);
#     ZITADEL_PAT_EXPIRATION is already required below
#   - the public auth host now answers 404 for the console and admin APIs (infra/caddy/auth-restricted.caddy), but
#     tools/seed-zitadel reaches those APIs through OIDC_ISSUER, i.e. through that host. In prod the seed needs
#     another route to ZITADEL (internal URL with the public Host header) or a temporary unrestricted Caddy.
#   - choose CADDY_TLS (default "internal" = Caddy's private CA; clients must trust it)
#   - mail: there is no mailpit here; the Postal stack arrives in P1 (mail.<domain> answers 502 until then)

x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    <<: *restart
  backup-scheduler:
    <<: *restart
  valkey:
    <<: *restart
  valkey-oidc:
    <<: *restart
  zitadel-api:
    <<: *restart
    command: start-from-init --masterkeyFromEnv --config /etc/zitadel/smtp-bootstrap.yaml
    volumes:
      - ../zitadel/smtp-bootstrap.yaml:/etc/zitadel/smtp-bootstrap.yaml:ro
    environment:
      # Native SMTP bootstrap settings. They apply when the identity instance is first created.
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_SMTP_HOST: ${ZITADEL_SMTP_HOST:-}
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_SMTP_PLAINAUTH_USER: ${ZITADEL_SMTP_USER:-}
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_SMTP_PLAINAUTH_PASSWORD: ${ZITADEL_SMTP_PASSWORD:-}
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_TLS: ${ZITADEL_SMTP_TLS:-}
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_FROM: ${ZITADEL_SMTP_FROM:-}
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_FROMNAME: ${ZITADEL_SMTP_FROM_NAME:-}
      # Prod must choose an expiry for the two bootstrap tokens (compose.yaml defaults to 2099 for dev). Required, so
      # a prod start without it fails instead of minting tokens that never expire (CR-10). Format:
      # ZITADEL_PAT_EXPIRATION=2027-01-01T00:00:00Z. It only applies when the first instance is created.
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: ${ZITADEL_PAT_EXPIRATION:?set ZITADEL_PAT_EXPIRATION in .env (RFC 3339, e.g. 2027-01-01T00:00:00Z; prod tokens must expire)}
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_PAT_EXPIRATIONDATE: ${ZITADEL_PAT_EXPIRATION:?set ZITADEL_PAT_EXPIRATION in .env (RFC 3339, e.g. 2027-01-01T00:00:00Z; prod tokens must expire)}
  zitadel-login:
    <<: *restart
  api:
    <<: *restart
    environment:
      # Required in prod: compose.yaml defaults to the dev-only mailpit, which does not exist here, so a start without
      # a real mail server would silently fail to send every email.
      SMTP_URL: ${SMTP_URL:?set SMTP_URL in .env}
  worker:
    <<: *restart
    environment:
      SMTP_URL: ${SMTP_URL:?set SMTP_URL in .env}
  gotenberg:
    <<: *restart
  portal:
    <<: *restart
    environment:
      # Required in prod, for the same reason as the workspace key. A separate key and id: the apps never share one.
      SESSION_ENC_KEY: ${PORTAL_SESSION_ENC_KEY:?set PORTAL_SESSION_ENC_KEY in .env (32 random bytes, base64, from openssl rand -base64 32)}
      SESSION_ENC_KEY_ID: ${PORTAL_SESSION_ENC_KEY_ID:?set PORTAL_SESSION_ENC_KEY_ID in .env (e.g. p1)}
  workspace:
    <<: *restart
    environment:
      # Required in prod so a start without the session key fails instead of running with an empty one.
      SESSION_ENC_KEY: ${SESSION_ENC_KEY:?set SESSION_ENC_KEY in .env (32 random bytes, base64, from openssl rand -base64 32)}
      SESSION_ENC_KEY_ID: ${SESSION_ENC_KEY_ID:?set SESSION_ENC_KEY_ID in .env (e.g. k1)}
  caddy:
    <<: *restart
    ports:
      - '${BIND_ADDR:?set BIND_ADDR in .env (the server interface address)}:80:80'
      - '${BIND_ADDR}:443:443'
    volumes:
      # Restricts the public auth host to OIDC sign-in paths (the Caddyfile imports /etc/caddy/auth.d/*).
      - type: bind
        source: ../caddy/auth-restricted.caddy
        target: /etc/caddy/auth.d/restricted.caddy
        read_only: true
        bind:
          create_host_path: false
      # Restricts the public API host to the paths outside callers need (the Caddyfile imports /etc/caddy/api.d/*).
      - type: bind
        source: ../caddy/api-restricted.caddy
        target: /etc/caddy/api.d/restricted.caddy
        read_only: true
        bind:
          create_host_path: false
    environment:
      # In prod the apps run as containers, never on the host.
      WORKSPACE_UPSTREAM: workspace:3000
      API_UPSTREAM: api:3001
      PORTAL_UPSTREAM: portal:3000
