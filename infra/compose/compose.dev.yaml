# Dev overlay: use together with compose.yaml, always with --env-file .env (see the header of compose.yaml).
#   docker compose --env-file .env -f infra/compose/compose.yaml -f infra/compose/compose.dev.yaml --profile core up -d --wait --wait-timeout 300
#
# What it adds:
#   - Caddy published on 127.0.0.1:80 and :443 only (Windows reaches it through WSL localhost forwarding)
#   - Postgres and Valkey published on 127.0.0.1 only, for apps and tests that run on the host
#   - Caddy upstreams for app.localhost, api.localhost and portal.localhost point at dev servers on the host
#     (workspace :3000, api :3001, portal :3002)
#   - Mailpit (fake SMTP server with a web UI) behind https://mail.localhost; its SMTP port on 127.0.0.1:1025
#   - BOS_DEV_LOGIN_RATE_LIMIT=200 on the workspace service (the `app` profile), so e2e runs do not trip the login limit
#   - ClamAV (profile `files`) published on 127.0.0.1:3310
#   - zitadel-api can reach host.docker.internal, so Actions v2 webhooks can call a host-run API on :3001

services:
  caddy:
    ports:
      - '127.0.0.1:80:80'
      - '127.0.0.1:443:443'
    environment:
      # Host dev servers (`next dev` on 3000, `nest start --watch` on 3001) must listen on 0.0.0.0, not only
      # on 127.0.0.1, or Caddy (which reaches them through the docker bridge) gets "connection refused".
      WORKSPACE_UPSTREAM: ${WORKSPACE_UPSTREAM:-host.docker.internal:3000}
      API_UPSTREAM: ${API_UPSTREAM:-host.docker.internal:3001}
      # The portal's `next dev` runs on 3002 (apps/portal/package.json).
      PORTAL_UPSTREAM: ${PORTAL_UPSTREAM:-host.docker.internal:3002}
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  postgres:
    ports:
      - '127.0.0.1:5432:5432'
    # Published ports do not work from a container that is only on an internal network, so postgres
    # (and valkey below) also join edge in dev.
    networks: [backend, edge]

  valkey:
    ports:
      - '127.0.0.1:6379:6379'
    networks: [backend, edge]

  clamav:
    # For a host-run API and tests (CLAMD_HOST=127.0.0.1). Published ports need a non-internal network, so the
    # base file already puts clamav on its egress network (not `edge`), which has a route out.
    ports:
      - '127.0.0.1:3310:3310'

  zitadel-api:
    # Actions v2 webhooks go from ZITADEL to the API. A host-run API on :3001 is reachable at host.docker.internal.
    # [unverified] ZITADEL may block private or host addresses in its outbound calls; U6's probe checks.
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  mailpit:
    profiles: [core]
    image: axllent/mailpit:v1.34@sha256:23a2ef85bc50853ab3093645d1d64679afd8887e89da5e48a88940c172591a4e
    # SMTP on 127.0.0.1:1025 for a host-run API and worker (SMTP_URL=smtp://127.0.0.1:1025). The web UI stays
    # behind Caddy at https://mail.localhost.
    ports:
      - '127.0.0.1:1025:1025'
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: '1'
      MP_SMTP_AUTH_ALLOW_INSECURE: '1'
      MP_MAX_MESSAGES: '500'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    # edge: so Caddy can serve the web UI. backend: so ZITADEL can send mail to mailpit:1025.
    networks: [edge, backend]
    deploy:
      resources:
        limits:
          # 40M, not 64M: keeps the dev core total under 3.2 GB now that valkey-oidc exists (see compose.yaml header).
          memory: 40M

  seed-zitadel:
    environment:
      BOS_SEED_DEV_MAILPIT: 'true'
      # Dev only: the seed registers the customer portal's own OIDC app with <origin>/auth/callback and writes its
      # client id to .dev/zitadel-portal.env (read by the portal service). Not set in compose.yaml, so a seed run
      # from the base file or production config creates no portal app (the production portal client is set up
      # by the operator).
      PORTAL_PUBLIC_URL: https://${PORTAL_HOST:-portal.localhost}

  workspace:
    environment:
      # Dev only: the login limit (CR-03) is 20 per minute per client IP, and all local traffic shares one Caddy
      # IP, so a persona e2e run trips it. The app refuses this unless WORKSPACE_PUBLIC_URL is localhost or
      # *.localhost. Never copy it to compose.yaml or compose.prod.yaml.
      BOS_DEV_LOGIN_RATE_LIMIT: ${BOS_DEV_LOGIN_RATE_LIMIT:-200}

  prometheus:
    ports:
      - '${PROMETHEUS_BIND_ADDR:-127.0.0.1}:${PROMETHEUS_PORT:-19090}:9090'
    networks: [backend, edge]
