# pgBackRest settings for Business OS. Mounted read-only at /etc/pgbackrest/pgbackrest.conf in the `postgres`
# service (which takes the backups) and in the `restore-drill` service (which restores them).
# postgresql.conf sends every finished WAL file here: archive_command = 'pgbackrest --stanza=bos archive-push %p'.
#
# A "stanza" is pgBackRest's name for one database cluster plus its backups. Ours is called `bos`.

[global]
# Local repository: a Docker volume (pgbackrest-repo) on the same host as the database. It does NOT survive losing
# the host or `docker compose down --volumes`. An offsite copy is still open (see the repo2 block below).
repo1-path=/var/lib/pgbackrest
repo1-type=posix

# Encryption at rest (CR-07): every file in the repository is encrypted with AES-256-CBC. The passphrase is NOT
# in this file: pgBackRest reads it from the PGBACKREST_REPO1_CIPHER_PASS environment variable (compose passes it
# from .env into the postgres, restore-drill and backup-scheduler services). Lose that passphrase and every backup
# is unreadable, so keep it with ZITADEL_MASTERKEY.
#
# !! A repository that was created WITHOUT encryption cannot be opened once this is set (pgBackRest cannot switch a
# !! stanza between plain and encrypted). On an existing dev stack, start a fresh repository: stop the stack and
# !! delete the pgbackrest-repo volume (docker volume rm bos_pgbackrest-repo), then run `pnpm stack:up` and
# !! `bash infra/backup/backup.sh` again. Old backups are lost; they could not be read any more anyway.
# !! Until that is done, WAL archiving fails and WAL piles up in pg_wal. infra/backup/backup.sh detects this and says so.
repo1-cipher-type=aes-256-cbc

# ---- Offsite repository (repo2): NOT configured yet -------------------------------------------------------------
# repo1 lives on the same host as the database, so it protects against a bad migration or a dropped table, not
# against losing the server. A second repository elsewhere closes that gap. The target (S3-compatible bucket,
# another host over SFTP, ...) is an open decision for Kuu: question Q15 in the Business OS decision log. Do not
# invent a target here; when Q15 is answered, fill in and uncomment a block like this one (S3 shown as the example):
#
#   repo2-type=s3
#   repo2-path=/bos
#   repo2-s3-endpoint=<endpoint of the chosen provider>
#   repo2-s3-bucket=<bucket>
#   repo2-s3-region=<region>
#   repo2-s3-uri-style=path
#   repo2-retention-full-type=count
#   repo2-retention-full=4
#   repo2-cipher-type=aes-256-cbc
#
# Secrets never go in this file. pgBackRest reads them from the environment, which compose must then pass to the
# postgres, backup-scheduler and restore-drill services:
#   PGBACKREST_REPO2_S3_KEY, PGBACKREST_REPO2_S3_KEY_SECRET, PGBACKREST_REPO2_CIPHER_PASS (use a different
#   passphrase from repo1's). Once repo2 exists, archive-push writes to both repositories: an unreachable repo2 makes
#   WAL archiving fail, so add monitoring before enabling it.

# Keep the two newest full backups (and the WAL needed to restore from either). Older ones are deleted
# automatically after the next full backup.
repo1-retention-full-type=count
repo1-retention-full=2

# Start the backup at once instead of waiting for the next checkpoint (up to ~5 minutes). Fine for a small database.
start-fast=y

# zstd: fast, and noticeably smaller than no compression.
compress-type=zst
compress-level=3

# Where pgBackRest writes its own logs and temporary spool files (created by the postgres image build).
log-path=/var/log/pgbackrest
spool-path=/var/spool/pgbackrest
log-level-console=info
log-level-file=detail

[bos]
# Same path in the postgres service and in the restore-drill service, so a restore lands where Postgres expects it.
pg1-path=/var/lib/postgresql/data
pg1-socket-path=/var/run/postgresql
pg1-user=postgres
