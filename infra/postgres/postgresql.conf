# Business OS Postgres 16 settings. Loaded with `postgres -c config_file=...`, so this file REPLACES the
# image default: everything the server needs must be listed here.
# Sized for the 1 GiB container limit in compose.yaml.

listen_addresses = '*'
max_connections = 100
password_encryption = scram-sha-256

shared_buffers = 256MB
effective_cache_size = 512MB
work_mem = 4MB
maintenance_work_mem = 64MB
dynamic_shared_memory_type = posix

# Write-ahead log and pgBackRest archiving (contract with U2: stanza name "bos").
# Until `pgbackrest stanza-create` has run (infra/backup/backup.sh), archive-push fails and WAL piles up in
# pg_wal. That is expected in a fresh dev stack; run the first backup soon.
wal_level = replica
archive_mode = on
archive_command = 'pgbackrest --stanza=bos archive-push %p'
# 300 s, not 60 s (Kuu, OQ-R7-01 b, ADR 0015 amendment): an idle database still forces one 16 MB WAL segment per
# timeout, and each one is compressed, encrypted and pushed. 300 s caps that at 288 segments (4.6 GB) a day instead
# of 1440 (23 GB). The price: the newest 5 minutes of changes can be lost, which stays inside the 15 min RPO.
archive_timeout = 300
max_wal_size = 1GB

# Measurement (U1-06). pg_stat_statements needs a restart to load; `CREATE EXTENSION` is run by init-dbs.sh (new
# volume) and infra/scripts/app-up.sh (every deploy). track_io_timing adds block read/write time to those rows.
shared_preload_libraries = 'pg_stat_statements'
track_io_timing = on

# SSD storage and a database that mostly fits in memory: random reads cost about what sequential ones do, the disk
# takes many requests at once, and JIT compilation costs more than it saves on short OLTP statements.
random_page_cost = 1.1
effective_io_concurrency = 200
jit = off

# Logging to stdout (docker logs)
log_timezone = 'UTC'
timezone = 'UTC'
log_line_prefix = '%m [%p] %q%u@%d '
log_min_duration_statement = 500
# Slow-statement lines show the statement text with $1, $2 placeholders but no bound values (names, amounts, ids).
log_parameter_max_length = 0
log_checkpoints = on

datestyle = 'iso, ymd'
default_text_search_config = 'pg_catalog.english'
