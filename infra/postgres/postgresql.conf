# Business OS Postgres 16 settings. Loaded with `postgres -c config_file=...`, so this file REPLACES the
# image default: everything the server needs must be listed here.
# Sized for the 1 GiB container limit in compose.yaml.

listen_addresses = '*'
max_connections = 100
password_encryption = scram-sha-256

shared_buffers = 256MB
effective_cache_size = 512MB
work_mem = 4MB
maintenance_work_mem = 64MB
dynamic_shared_memory_type = posix

# Write-ahead log and pgBackRest archiving (contract with U2: stanza name "bos").
# Until `pgbackrest stanza-create` has run (infra/backup/backup.sh), archive-push fails and WAL piles up in
# pg_wal. That is expected in a fresh dev stack; run the first backup soon.
wal_level = replica
archive_mode = on
archive_command = 'pgbackrest --stanza=bos archive-push %p'
archive_timeout = 60
max_wal_size = 1GB

# Logging to stdout (docker logs)
log_timezone = 'UTC'
timezone = 'UTC'
log_line_prefix = '%m [%p] %q%u@%d '
log_min_duration_statement = 500
log_checkpoints = on

datestyle = 'iso, ymd'
default_text_search_config = 'pg_catalog.english'
